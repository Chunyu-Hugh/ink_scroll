name: e2e

# The evaluator. Every push and every PR has to satisfy the same 95 assertions
# that `node tools/test.js` runs locally — this is what makes the loop close:
# a change is only "done" when GitHub's own runner says so.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install harness deps
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          cd tools && npm ci
          npx playwright install --with-deps chromium

      - name: build fake camera fixtures
        run: python3 tools/make-fixtures.py

      - name: end-to-end interactions
        env:
          # CI runners are 2 vCPU software-rendering boxes: keep the budget honest
          # but do not fail on raw throughput (the local default is 22 fps).
          INK_MIN_FPS: '12'
          INK_MIN_FPS_HEAVY: '10'
        run: node tools/test.js

      - name: creative-tool integrations (OSC · TouchDesigner 路径)
        run: python3 tools/check_integrations.py

      - name: result
        if: always()
        run: cat tools/last-run.json 2>/dev/null || echo '{"error":"no result file"}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/shots
          if-no-files-found: ignore
