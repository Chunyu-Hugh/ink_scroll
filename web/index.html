  el.style.display=(S.mode==='phone' && list.length)?'flex':'none';
  for(const tg of list){ const d=document.createElement('div'); d.className='seal'+(tg.frozen?' frozen':'');
    d.style.background=tg.hue||'#c96442'; d.textContent=tg.seq||''; el.appendChild(d); }
}

/* ───────────────────────────────────────────────────────────
   Eye gaze — ArUco marker on glasses

   The user wears glasses with a printed ArUco marker (≈4-5cm) stuck on
   the bridge or frame. js-aruco2 detects the marker (sub-pixel) every
   frame; the marker center serves as a "head/gaze proxy" — most
   real-life "looking somewhere" involves the head turning, so marker
   position tracks gaze direction faithfully enough for a forgiving art
   piece.

   Pipeline:
   1. Lazy-load js-aruco2 (UMD, ~26 KB, single file) and instantiate
      AR.Detector (default ARUCO dictionary).
   2. 5-dot calibration (4 corners + center), 2 clicks each. Each click
      captures the marker's normalized image-space center alongside the
      dot's screen position.
   3. Closed-form 3-param linear least squares fits screen_x and
      screen_y from (marker_nx, marker_ny). Sub-pixel detection means
      10 samples are plenty.
   4. At runtime, detect → linear-map → exponential smoothing → spot.
   ─────────────────────────────────────────────────────────── */
let arLoaded=false, arLoading=null, arDetector=null;
let gazeFit=null;          // {x:[a,b,c], y:[a,b,c]} after calibration
let calibSamples=[];       // [{nx,ny,tx,ty}, ...] collected during calibration
let arCvs=null, arCtx=null; // separate unmirrored canvas for ArUco (mirrored frames break detection)

function loadArUco(){
  if(arLoaded && arDetector) return Promise.resolve();
  if(arLoading) return arLoading;
  // The jsDelivr +esm bundle has a CommonJS-to-ESM transform bug (writes to
  // `(void 0).CV` because ESM modules have undefined top-level `this`). Workaround:
  // load the raw src/*.js files as classic scripts. Each one uses
  // `var X = X || {}; this.X = X;` which works in classic scripts where top-level
  // `this === window`. src/aruco.js's broken `require('./cv').CV` branch is bypassed
  // because `this.CV` is already truthy from the earlier cv.js load.
  arLoading = (async()=>{
    const base = 'https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/';
    for(const file of ['cv.js', 'svd.js', 'posit1.js', 'aruco.js']){
      await new Promise((res, rej)=>{
        const s = document.createElement('script');
        s.src = base + file;
        s.async = false;
        s.onload = res;
        s.onerror = ()=>rej(new Error('Failed to load js-aruco2 dependency: '+file));
        document.head.appendChild(s);
      });
    }
    if(!window.AR || !window.AR.Detector){
      throw new Error('js-aruco2 src files loaded but window.AR.Detector is still undefined');
    }
    arDetector = new window.AR.Detector();
    arLoaded = true;
  })();
  return arLoading;
}

// Get an UNMIRRORED camera frame (ArUco markers are not mirror-symmetric;
// detection silently fails on a flipped image). We keep a side canvas
// that always paints the raw video, regardless of S.mirrorX.
function getArFrame(){
  if(!vid || vid.readyState<2 || !VW || !VH) return null;
  if(!arCvs){
    arCvs = document.createElement('canvas');
    arCtx = arCvs.getContext('2d', { willReadFrequently:true });
  }
  if(arCvs.width !== VW || arCvs.height !== VH){
    arCvs.width = VW; arCvs.height = VH;
  }
  arCtx.drawImage(vid, 0, 0, VW, VH);
  return arCtx.getImageData(0, 0, VW, VH);
}

function markerCenter(m, w, h){
  const c = m.corners;
  return {
    nx: (c[0].x+c[1].x+c[2].x+c[3].x)/(4*w),
    ny: (c[0].y+c[1].y+c[2].y+c[3].y)/(4*h),
  };
}

// 3×3 least squares: solve y = a + b·x1 + c·x2 via normal equations + cofactor inversion.
// Same closed-form as before; here x1=nx, x2=ny (marker center in [0,1]² camera coords).
function fitLinear(samples, getY){
  let n=0, Sx=0, Sy=0, Sxx=0, Syy=0, Sxy=0;
  let Sz=0, Sxz=0, Syz=0;
  for(const s of samples){
    const x=s.nx, y=s.ny, z=getY(s);
    n++; Sx+=x; Sy+=y; Sxx+=x*x; Syy+=y*y; Sxy+=x*y;
    Sz+=z; Sxz+=x*z; Syz+=y*z;
  }
  const C11=Sxx*Syy - Sxy*Sxy;
  const C12=-(Sx*Syy - Sxy*Sy);
  const C13=Sx*Sxy - Sxx*Sy;
  const det=n*C11 + Sx*C12 + Sy*C13;
  if(Math.abs(det)<1e-9) return null;
  const C22=n*Syy - Sy*Sy;
  const C23=-(n*Sxy - Sx*Sy);
  const C33=n*Sxx - Sx*Sx;
  const inv=1/det;
  const m00=C11*inv, m01=C12*inv, m02=C13*inv;
  const m10=C12*inv, m11=C22*inv, m12=C23*inv;
  const m20=C13*inv, m21=C23*inv, m22=C33*inv;
  return [
    m00*Sz + m01*Sxz + m02*Syz,
    m10*Sz + m11*Sxz + m12*Syz,
    m20*Sz + m21*Sxz + m22*Syz,
  ];
}

function showGazeLoading(){
  const cal=document.getElementById('calib');
  cal.classList.remove('error');
  document.getElementById('calib-dismiss').style.display='none';
  document.getElementById('calib-dots').innerHTML='';
  document.getElementById('calib-title').textContent=t('gazeLoading');
  document.getElementById('calib-sub').textContent=t('gazeLoadingSub');
  cal.classList.add('show');
}

async function enterGaze(){
  S.gazeReady=false; S.gazePos=null; S.gazeSmooth=null;
  gazeFit=null; calibSamples=[];
  showGazeLoading();
  try{
    await loadArUco();
    if(S.mode!=='gaze'){ hideCalibration(); return; }
    if(!arDetector) arDetector = new AR.Detector();
    // Camera was set up by start() because gaze.needCam=true. Wait briefly if not ready yet.
    for(let i=0;i<20 && (!vid || vid.readyState<2); i++){ await new Promise(r=>setTimeout(r,100)); }
    if(S.mode!=='gaze'){ hideCalibration(); return; }
    startCalibration();
  }catch(e){
    console.error('[gaze] init failed:', e);
    gazeFallback(e);
  }
}

function exitGaze(){
  S.gazeReady=false; S.gazePos=null; gazeFit=null; calibSamples=[];
  hideCalibration();
  // Keep arDetector cached across mode switches; the side canvas is reused too.
}

function gazeFallback(err){
  S.gazeReady=false; S.gazePos=null;
  const cal=document.getElementById('calib');
  document.getElementById('calib-dots').innerHTML='';
  cal.classList.add('error','show');
  document.getElementById('calib-title').textContent=t('gazeFailHint');
  let detail = err ? String(err.message||err) : '';
  if(err && err.stack){
    const frame = err.stack.split('\n').find(l=>l.indexOf('http')>=0);
    if(frame) detail += '\n' + frame.trim();
  }
  document.getElementById('calib-sub').style.whiteSpace='pre-wrap';
  document.getElementById('calib-sub').textContent = detail;
  const btn=document.getElementById('calib-dismiss');
  btn.textContent=t('errMouse');
  btn.style.display='';
}

/* ── Gaze calibration: 5 dots (4 corners + center), 2 clicks each = 10 samples ── */
const CALIB_POINTS=[[12,15],[88,15],[50,50],[12,85],[88,85]];
const CLICKS_PER_DOT=2;
function startCalibration(){
  S.gazeReady=false;
  gazeFit=null; calibSamples=[];
  const cal=document.getElementById('calib');
  cal.classList.remove('error');
  const dismiss=document.getElementById('calib-dismiss');
  dismiss.textContent=t('phoneFallbackBtn');
  dismiss.style.display='';                 // always escapable — no printed marker? go pointer
  const layer=document.getElementById('calib-dots');
  layer.innerHTML='';
  document.getElementById('calib-title').textContent=t('calibTitle');
  document.getElementById('calib-sub').textContent=t('calibSub');
  let remaining=CALIB_POINTS.length;
  CALIB_POINTS.forEach(([px,py])=>{
    const d=document.createElement('button');
    d.type='button';d.className='calib-dot';
    d.style.left=px+'%';d.style.top=py+'%';
    d.textContent=CLICKS_PER_DOT;
    let clicks=0;
    d.addEventListener('click',()=>{
      // On click: grab an unmirrored frame, detect the marker, pair its center with this dot.
      if(arDetector){
        try{
          const fd = getArFrame();
          if(fd){
            const markers = arDetector.detect(fd);
            if(markers.length){
              const c = markerCenter(markers[0], fd.width, fd.height);
              calibSamples.push({
                nx:c.nx, ny:c.ny,
                tx:window.innerWidth*px/100*(S.dpr||1),   // fit maps to canvas device px
                ty:window.innerHeight*py/100*(S.dpr||1),
              });
            }
          }
        }catch(e){ console.warn('[gaze] capture on click failed:',e); }
      }
      clicks++;
      if(clicks>=CLICKS_PER_DOT){
        d.classList.add('done');d.textContent='✓';d.disabled=true;
        if(--remaining<=0) finishCalibration();
      } else {
        d.textContent=CLICKS_PER_DOT-clicks;
      }
    });
    layer.appendChild(d);
  });
  cal.classList.add('show');
}

function finishCalibration(){
  if(calibSamples.length < 3){
    gazeFallback(new Error('Not enough calibration samples — ArUco marker not detected. Check: marker printed and stuck on glasses, good even lighting, marker fully visible to the camera, not severely tilted.'));
    return;
  }
  const bx = fitLinear(calibSamples, s=>s.tx);
  const by = fitLinear(calibSamples, s=>s.ty);
  if(!bx || !by){
    gazeFallback(new Error('Calibration regression failed (singular matrix). The marker may have been in the same spot for every click — turn your head naturally toward each dot before clicking.'));
    return;
  }
  gazeFit = { x:bx, y:by };
  S.gazeReady=true;
  const cal=document.getElementById('calib');
  document.getElementById('calib-title').textContent=t('calibDone');
  document.getElementById('calib-sub').textContent='';
  setTimeout(()=>{ cal.classList.remove('show'); flashHint(t('firstHintGaze')); },700);
}

function hideCalibration(){ document.getElementById('calib').classList.remove('show'); }

/* ───────────────────────────────────────────────────────────
   Scene change with crossfade
   ─────────────────────────────────────────────────────────── */
function changeScene(n){
  if(n===S.scene)return;
  if(!scCvs || !scCtx) return;                 // 画布还没建好（早期 gamepad 轮询）直接忽略
  const oldImg=document.createElement('canvas');oldImg.width=DW;oldImg.height=DH;
  oldImg.getContext('2d').drawImage(scCvs,0,0);
  S.scene=n;
  S.delayBuf=[]; S.delayOut=null;                   // 换场景同样清空延迟缓冲
  // 累积：换画不擦留痕 —— 你写过的地方，换一幅画依然透出来（Ondák 式"被写过的纸"）
  // 想回到旧行为：?accrete=0
  if(S.accrete===false && paintCtx) paintCtx.clearRect(0,0,paintCvs.width,paintCvs.height);
  if(glowCtx)glowCtx.clearRect(0,0,glowCvs.width,glowCvs.height);       // 长曝 buffer wipes too
  S.phone.ink=false; S.phone.strokeLast={};
  drawScene(performance.now()/1000);target=scCvs;genHidden();
  S.transition={active:true,from:oldImg,start:performance.now(),duration:500};
  document.querySelectorAll('.scene-dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  document.getElementById('hsc').textContent=sceneNameOf(n);
  sceneNav.classList.add('show');
  clearTimeout(changeScene._t);
  changeScene._t=setTimeout(()=>sceneNav.classList.remove('show'),2200);
}

/* ───────────────────────────────────────────────────────────
   Main render loop
   ─────────────────────────────────────────────────────────── */
function processFrame(){
  if(!S.running||!target)return;
  try{
  const m=M[S.mode];
  if(vid&&vid.readyState>=2){
    wkCtx.save();if(S.mirrorX){wkCtx.translate(VW,0);wkCtx.scale(-1,1);}
    wkCtx.drawImage(vid,0,0,VW,VH);wkCtx.restore();
  }
  const fd=(m.needsPixels&&vid&&vid.readyState>=2&&wkCvs)?wkCtx.getImageData(0,0,VW,VH):null;   // only flashlight/gaze read raw pixels — skip the ~1.2MB readback otherwise
  let spots;
  if(typeof m.spots==='function'){ spots=m.spots(fd)||[]; }
  else { let sp=(m.needCam&&!(vid&&vid.readyState>=2))?null:m.spot(fd); if(!sp&&S.mode==='mouse')sp={x:S.mouseX,y:S.mouseY,radius:S.radius}; spots=sp?[sp]:[]; }
  // 吸引循环 / 卷轴 — when idle, a lone spotlight drifts right→left (展卷), teasing the hidden layer to recruit passersby
  // …but NOT when a hand is present in hand-mode making a fist (收光 = deliberately dark); only attract when truly idle (no hand)
  if(spots.length===0 && S.running && !(S.mode==='hand' && S.gesture!=='none')){ S.attract=(S.attract||0)+0.0045;
    spots=[{x:DW*(0.82-0.64*((S.attract*0.22)%1)), y:DH*(0.5+0.16*Math.sin(S.attract*0.9)), radius:S.radius*0.8}]; }
  spots = spots.map(normSpot).filter(Boolean);
  if(S.ritual && performance.now() > (S.ritualUntil||0)) spots = [];   // 仪式未完成：不揭示
  if(S.together){                                   // 形式：共处（一个人揭不开）
    if(spots.length < S.togetherNeed){
      S.togetherLow = Math.min(1, S.togetherLow + 0.06);
      spots = [];                                   // 揭示被"人数"锁住
      if(S.togetherLow > 0.5 && !S.togetherHinted){
        S.togetherHinted = true;
        flashHint(t('fxTogether'), 2600);
      }
    }else{
      S.togetherLow = Math.max(0, S.togetherLow - 0.1);
      S.togetherHinted = false;
    }
  }
  if(S.delayMs>0){                                  // 形式：延迟
    const nowD=performance.now();
    const out=delayPush(S.delayBuf, spots, nowD, S.delayMs);
    S.delayOut=out; if(out) spots=out;
    else spots=[];                                  // 还没到 8 秒：什么都不显示（这才是延迟）
  }
  if(S.silence && S.silence.on && S.audio && S.audio.on){         // 形式：静默（显式开启，避免在安静型模态里误翻页）
    const quiet=(S.audio.level||0)<0.02;
    if(quiet){ if(!S.silence.since) S.silence.since=performance.now();
      if(!S.silence.acted && silenceFlip(performance.now()-S.silence.since, S.silence.needMs)){
        S.silence.acted=true;
        changeScene((S.scene+1)%SCENE_COUNT);
        flashHint(t('fxSilenceFlip'), 2200);
      }
    } else { S.silence.since=0; S.silence.acted=false; }
  }
  if(S.mode==='bridge'||S.mode==='osc') pushState(false);   // 闭环回传（节流 500ms）      // 契约归一化（id/presence/state 在这里补全）
  // 留白守卫 — don't let a crowd floodlight the whole scroll; shrink radii once total revealed area passes ~38% of the painting
  if(S.imgBounds && spots.length>2){ const ib=S.imgBounds, maxA=ib.w*ib.h*0.38; let area=0; for(const s of spots){const r=s.radius||S.radius;area+=Math.PI*r*r;}
    if(area>maxA){ const k=Math.sqrt(maxA/area); for(const s of spots)s.radius=(s.radius||S.radius)*k; } }
  // skip the scene re-render (+ its particle animation) when nothing will reveal it (idle wall)
  const revealActive = spots.length||S.paint||S.phone.ink||S.glow||S.phone.splats.length||S.creature||S.mirror||S.orbs.length||S.transition.active;
  if(revealActive) drawScene(performance.now()/1000);
  target=scCvs;

  ctx.clearRect(0,0,DW,DH);
  if(vid&&vid.readyState>=2&&S.imgBounds){
    const c=camCover(),ib=c.ib;
    ctx.save();ctx.globalAlpha=.15;
    if(S.mirrorX){ctx.translate(ib.x+ib.w,ib.y);ctx.scale(-1,1);ctx.drawImage(vid,c.sx,c.sy,c.sw,c.sh,0,0,ib.w,ib.h);}
    else{ctx.drawImage(vid,c.sx,c.sy,c.sw,c.sh,ib.x,ib.y,ib.w,ib.h);}
    ctx.restore();
  }
  ctx.drawImage(hiCvs,0,0,DW,DH);
  if(S.repel && spots[0]){
    ensureDust();
    S.dust.level = repelTick(spots[0], S.dust.ctx);
  }
  if(S.summon && spots[0]){
    if(!S.summonDots.length) summonAdd(S.summonDots, spots[0].x, spots[0].y, 12);
    summonStep(S.summonDots, spots[0].x, spots[0].y, 0.18);
    ensurePaint();
    paintSctx.clearRect(0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over';
    paintSctx.drawImage(scCvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='destination-in';
    for(const d of S.summonDots){
      const g=paintSctx.createRadialGradient(d.x,d.y,0,d.x,d.y,26);
      g.addColorStop(0,'rgba(255,255,255,.85)'); g.addColorStop(1,'rgba(255,255,255,0)');
      paintSctx.fillStyle=g; paintSctx.beginPath(); paintSctx.arc(d.x,d.y,26,0,7); paintSctx.fill();
    }
    paintSctx.globalCompositeOperation='source-over';
    withBounds(()=>ctx.drawImage(paintScratch,0,0,DW,DH));
  }
  if(S.offering && S.offerings.length){
    const nowO=performance.now();
    ensurePaint();
    paintSctx.clearRect(0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over';
    paintSctx.drawImage(scCvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='destination-in';
    for(const o of offeringGrow(S.offerings,nowO)){
      const g=paintSctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`rgba(255,255,255,${(0.95*o.a).toFixed(3)})`);
      g.addColorStop(0.55,`rgba(255,255,255,${(0.5*o.a).toFixed(3)})`);
      g.addColorStop(1,'rgba(255,255,255,0)');
      paintSctx.fillStyle=g; paintSctx.beginPath(); paintSctx.arc(o.x,o.y,o.r,0,7); paintSctx.fill();
    }
    paintSctx.globalCompositeOperation='source-over';
    withBounds(()=>ctx.drawImage(paintScratch,0,0,DW,DH));
  }
  if(S.dust.cvs && S.dust.level>0.01){                 // 吹散的灰尘 → 露出彩色
    ensurePaint();
    paintSctx.clearRect(0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over';
    paintSctx.drawImage(scCvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='destination-in';
    paintSctx.drawImage(S.dust.cvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over';
    withBounds(()=>ctx.drawImage(paintScratch,0,0,DW,DH));
  }
  // 留痕 — persistent paint-on reveal (mode toggle 'i'): spots paint into a lasting mask; scene shows through it
  if(S.paint || S.phone.ink){
    ensurePaint();
    if(S.paint){ paintCtx.globalCompositeOperation='source-over';
      for(let i=0;i<Math.min(spots.length,6);i++){ const s=spots[i]; const r=s.radius||S.radius;
        paintCtx.drawImage(paintBrush, s.x-r, s.y-r, r*2, r*2); } }
    const fade=Math.max(S.paintFade,(S.breath||0)*0.03);   // 吐纳: exhale slowly re-floods the ink
    if(fade>0){ paintCtx.globalCompositeOperation='destination-out'; paintCtx.fillStyle=`rgba(0,0,0,${fade})`; paintCtx.fillRect(0,0,DW,DH); paintCtx.globalCompositeOperation='source-over'; }
    paintSctx.clearRect(0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over'; paintSctx.drawImage(scCvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='destination-in'; paintSctx.drawImage(paintCvs,0,0,DW,DH);
    paintSctx.globalCompositeOperation='source-over';
    withBounds(()=>ctx.drawImage(paintScratch,0,0,DW,DH));
  }
  if(spots.length){
    const cap=Math.min(spots.length,6);
    // per-spot reveal (each phone its own light/brush) — clip to imgBounds to bound the blit
    for(let i=0;i<cap;i++){ const s=spots[i];
      withBounds(()=>{ ctx.beginPath(); buildSpotPath(s); ctx.clip(); ctx.drawImage(scCvs,0,0,DW,DH); });
    }
    // identity rings (frozen = thicker)
    for(let i=0;i<cap;i++){ const s=spots[i]; const r=s.radius||S.radius;
      ctx.strokeStyle='rgba(20,20,19,.30)';ctx.lineWidth=(s.frozen?4:2.5);
      ctx.beginPath();ctx.arc(s.x,s.y,r+1,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=s.hue?hexA(s.hue,.62):'rgba(201,100,66,.34)';
      ctx.lineWidth=s.frozen?2.5:1.4;
      ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.stroke();
    }
    // 合手成圆 — where two beams overlap, the colour blooms; gold seam + a one-shot buzz
    if(spots.length>=2){
      const seen={};
      for(let i=0;i<cap;i++)for(let j=i+1;j<cap;j++){
        const A=spots[i],B=spots[j],ra=A.radius||S.radius,rb=B.radius||S.radius;
        if(Math.hypot(A.x-B.x,A.y-B.y)>=ra+rb) continue;
        withBounds(()=>{ ctx.beginPath();ctx.arc(A.x,A.y,ra,0,Math.PI*2);ctx.clip();
          ctx.beginPath();ctx.arc(B.x,B.y,rb,0,Math.PI*2);ctx.clip();
          ctx.globalCompositeOperation='lighter';ctx.drawImage(scCvs,0,0,DW,DH); });
        ctx.save();ctx.strokeStyle='rgba(212,175,55,.6)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(A.x,A.y,ra,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(B.x,B.y,rb,0,Math.PI*2);ctx.stroke();ctx.restore();
        if(A.id&&B.id){ const key=A.id<B.id?A.id+'|'+B.id:B.id+'|'+A.id; seen[key]=1;
          if(!S.phone.overlap[key]){ S.phone.overlap[key]=1; const ai=String(A.id).split('#')[0], bi=String(B.id).split('#')[0];
            phoneHaptic(ai,[15,30,15]); phoneHaptic(bi,[15,30,15]);
            phoneSend(ai,{type:'sfx',sound:'pluck',pan:A.x/DW*2-1}); phoneSend(bi,{type:'sfx',sound:'pluck',pan:B.x/DW*2-1}); } }   // 砚台之声
      }
      for(const k in S.phone.overlap){ if(!seen[k]) delete S.phone.overlap[k]; }
    }
  }

  // 摇出泼墨 — transient ink splatters reveal the colour layer, bloom, then fade
  if(S.phone.splats.length){
    const tnow=performance.now();
    S.phone.splats=S.phone.splats.filter(sp=>tnow-sp.t0<sp.life);
    for(const sp of S.phone.splats){
      const age=(tnow-sp.t0)/sp.life;                       // 0..1
      const grow=0.55+0.45*Math.min(1,age*2.6);             // expand fast, then settle
      const fade=age<0.12 ? age/0.12 : 1-(age-0.12)/0.88;   // quick fade-in, slow fade-out
      withBounds(()=>{ ctx.beginPath();
        for(const b of sp.blobs){const r=b.r*grow*sp.size; ctx.moveTo(sp.x+b.dx*sp.size+r,sp.y+b.dy*sp.size); ctx.arc(sp.x+b.dx*sp.size,sp.y+b.dy*sp.size,r,0,Math.PI*2);}
        ctx.clip(); ctx.globalAlpha=Math.max(0,Math.min(1,fade)); ctx.drawImage(scCvs,0,0,DW,DH); });
      if(sp.pop && age<0.3){ ctx.save(); ctx.globalAlpha=(1-age/0.3)*0.7; ctx.strokeStyle='rgba(255,240,214,0.95)'; ctx.lineWidth=Math.max(2,5*(1-age/0.3)); ctx.beginPath(); ctx.arc(sp.x,sp.y, sp.size*(0.5+age*4),0,6.2832); ctx.stroke(); ctx.restore(); }
    }
  }

  // 长曝留痕 — accumulate glowing light-trails from every spotlight ('g' toggle, 's' save PNG)
  if(S.glow){
    ensureGlow();
    glowCtx.globalCompositeOperation='lighter'; glowCtx.globalAlpha=0.5;
    for(let i=0;i<Math.min(spots.length,6);i++){ const s=spots[i], r=(s.radius||S.radius)*0.9; glowCtx.drawImage(glowSprite(s.hue||'#c96442'), s.x-r,s.y-r,r*2,r*2); }
    glowCtx.globalAlpha=1; glowCtx.globalCompositeOperation='destination-out'; glowCtx.fillStyle='rgba(0,0,0,0.004)'; glowCtx.fillRect(0,0,DW,DH);
    glowCtx.globalCompositeOperation='source-over';
    withBounds(()=>{ ctx.globalCompositeOperation='lighter'; ctx.drawImage(glowCvs,0,0,DW,DH); });
  }

  // 通灵生兽 — render an ink creature from each 体感 skeleton ('k' toggle)
  if(S.creature){ for(const k in S.phone.targets){ const tg=S.phone.targets[k]; if(tg.skel && String(tg.id).indexOf('#')<0) renderCreature(tg); } }
  // 镜影双修 — when two lights mirror about the centre, a glowing seam-band blooms ('y' toggle)
  if(S.mirror && spots.length>=2){ const a=spots[0],b=spots[1];
    const sym=1-Math.min(1,Math.abs((a.x+b.x)/2-DW/2)/(DW*0.4)), yo=1-Math.min(1,Math.abs(a.y-b.y)/(DH*0.4)), sc=Math.max(0,sym*0.6+yo*0.4);
    if(sc>0.15){ withBounds(()=>{ ctx.globalAlpha=sc*0.8; const bw=DW*0.08; ctx.beginPath(); ctx.rect(DW/2-bw/2,0,bw,DH); ctx.clip(); ctx.drawImage(scCvs,0,0,DW,DH); });
      ctx.save(); ctx.fillStyle='rgba(212,175,55,'+(0.18+sc*0.45)+')'; ctx.fillRect(DW/2-2,0,4,DH); ctx.restore(); } }
  // 天时入卷 — tint the scroll by hour of day ('t' toggle)
  if(S.timeTint){ const h=(new Date()).getHours(); let c=(h<6||h>=20)?'rgba(20,30,70,0.18)':(h<9?'rgba(230,150,90,0.14)':(h<17?'rgba(255,240,210,0.07)':'rgba(210,110,60,0.16)'));
    withBounds(()=>{ ctx.fillStyle=c; ctx.fillRect(0,0,DW,DH); }); }
  // 投光接光 — flying light orbs; caught when they reach another phone's spot
  if(S.orbs.length){ for(const o of S.orbs){ o.x+=o.vx; o.y+=o.vy; o.vy+=0.25; o.vx*=0.995;
      for(const s of spots){ if(String(s.id||'').split('#')[0]===o.owner)continue; if(Math.hypot(s.x-o.x,s.y-o.y)<(s.radius||S.radius)){ pushSplat(o.x,o.y,70,140); if(s.id)phoneHaptic(String(s.id).split('#')[0],[15,40,15]); o.t0=0; } } }
    S.orbs=S.orbs.filter(o=>o.t0&&performance.now()-o.t0<5000&&o.x>-60&&o.x<DW+60&&o.y<DH+100);
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.85;
    for(const o of S.orbs){ ctx.drawImage(glowSprite(o.hue), o.x-40,o.y-40,80,80); }
    ctx.restore(); }
  // 远客生辉 — persistent faint stars at each visitor's place on Earth
  if(S.geo.length){ withBounds(()=>{ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.9;
    for(const st of S.geo){ ctx.drawImage(glowSprite(st.hue), st.x*DW-11,st.y*DH-11,22,22); } }); }
  // 击节点墨 — a pulsing beat ring (display owns the clock)
  if(S.beat.on){ const ph=((performance.now()-S.beat.t0)%S.beat.period)/S.beat.period; ctx.save(); ctx.strokeStyle='rgba(201,100,66,'+(0.25+(1-ph)*0.5)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(DW/2,46,14+(1-ph)*26,0,Math.PI*2); ctx.stroke(); ctx.restore(); }

  // 校准网格：四角标 A/B/C/D、中心十字、1/3 与 2/3 分割线
  if(S.grid){
    const g=ctx;
    g.save();
    g.strokeStyle='rgba(217,119,87,.55)'; g.lineWidth=Math.max(1,2*S.dpr);
    g.beginPath();
    for(let i=1;i<=2;i++){ g.moveTo(DW*i/3,0); g.lineTo(DW*i/3,DH); g.moveTo(0,DH*i/3); g.lineTo(DW,DH*i/3); }
    g.stroke();
    g.strokeStyle='rgba(245,244,237,.85)'; g.lineWidth=Math.max(1,1.5*S.dpr);
    g.strokeRect(2*S.dpr,2*S.dpr,DW-4*S.dpr,DH-4*S.dpr);
    g.beginPath(); g.moveTo(DW/2-28*S.dpr,DH/2); g.lineTo(DW/2+28*S.dpr,DH/2);
    g.moveTo(DW/2,DH/2-28*S.dpr); g.lineTo(DW/2,DH/2+28*S.dpr); g.stroke();
    g.fillStyle='rgba(245,244,237,.92)';
    g.font=`600 ${Math.round(28*S.dpr)}px "Noto Serif SC",serif`;
    g.textAlign='left';  g.textBaseline='top';    g.fillText('A', 18*S.dpr, 14*S.dpr);
    g.textAlign='right'; g.fillText('B', DW-18*S.dpr, 14*S.dpr);
    g.textAlign='left';  g.textBaseline='bottom'; g.fillText('C', 18*S.dpr, DH-14*S.dpr);
    g.textAlign='right'; g.fillText('D', DW-18*S.dpr, DH-14*S.dpr);
    g.textAlign='center'; g.textBaseline='middle';
    g.font=`500 ${Math.round(16*S.dpr)}px "Noto Serif SC",serif`;
    g.fillText(`${Math.round(DW/S.dpr)}×${Math.round(DH/S.dpr)}  ${S.dpr.toFixed(2)}x`, DW/2, DH/2+52*S.dpr);
    g.restore();
  }

  if(S.transition.active){
    const elapsed=performance.now()-S.transition.start;
    const a=1-elapsed/S.transition.duration;
    if(a<=0){S.transition.active=false;S.transition.from=null;}
    else{ctx.save();ctx.globalAlpha=a;ctx.drawImage(S.transition.from,0,0);ctx.globalAlpha=1;ctx.restore();}
  }

  if(pip.style.display!=='none'&&vid){
    pipCtx.save();if(S.mirrorX){pipCtx.translate(pipW,0);pipCtx.scale(-1,1);}
    pipCtx.drawImage(vid,0,0,pipW,pipH);pipCtx.restore();
  }

  const exText = m.ex();
  gh.textContent = exText || '';
  gh.style.opacity = exText ? 1 : 0;
  document.getElementById('he-row').style.display = exText ? 'flex' : 'none';

  // 右侧手势图例 — show only in the webcam hand mode, highlight the gesture being made right now
  const gl=document.getElementById('glegend');
  if(gl){ if(S.mode==='hand'){ gl.classList.add('show');
      for(const row of gl.querySelectorAll('.gl-row')) row.classList.toggle('on', row.dataset.g===S.gesture);
    } else gl.classList.remove('show'); }

  fc++;const now=performance.now();if(now-ft>=1000){S.fps=fc;fc=0;ft=now;}

  // HUD updates (cached nodes — this runs 60× a second)
  HUD.hf.textContent=S.fps;
  HUD.hm.innerHTML=`${iconSvg(m.icon)} ${t(m.nameKey)}`;
  HUD.hs.textContent=t(STYLE_KEY[S.style]||'styleEdges');
  HUD.hr.textContent=Math.round(S.radius/S.dpr)+' · '+S.camSens+'×';
  if (exText){
    HUD.he.textContent = exText.replace(/^[\p{Emoji}\s]+/u,'');
    const lbl=document.getElementById('he-lbl');
    if(lbl) lbl.textContent=t(S.mode==='hand'?'hudGesture':'hudStatus');
  }

  // sensor meter: makes an invisible input (sound, movement) legible
  if(typeof m.meter==='function'){
    const mt=m.meter();
    HUD.meter.classList.add('show');
    if(mt){ HUD.mLbl.textContent=mt.label; HUD.mFill.style.width=Math.round(Math.max(0,Math.min(1,mt.value))*100)+'%'; }
  }else HUD.meter.classList.remove('show');

  if(S.mode==='hand'&&fc%4===0)setTimeout(pH,0);
  if((S.mode==='face'||S.mode==='eyes')&&fc%3===0)setTimeout(faceTick,0);
  }catch(e){console.error('Frame error:',e.message);}
  requestAnimationFrame(processFrame);
}

/* ───────────────────────────────────────────────────────────
   Camera
   ─────────────────────────────────────────────────────────── */
async function initCam(room=false){
  if(str){str.getTracks().forEach(t=>t.stop());}
  const want=room?'environment':'user';        // flashlight looks at the room, everything else at you
  try{str=await navigator.mediaDevices.getUserMedia({video:{facingMode:want,width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){
    try{str=await navigator.mediaDevices.getUserMedia({video:{facingMode:want},audio:false});}
    catch(e2){ str=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
  }
  vid=document.createElement('video');vid.srcObject=str;vid.setAttribute('playsinline','');vid.muted=true;
  await vid.play();
  VW=vid.videoWidth||640;VH=vid.videoHeight||480;
  pipW=160;pipH=Math.round(160*VH/VW);
  pip.width=pipW;pip.height=pipH;pip.style.height=pipH+'px';
  if(!wkCvs){wkCvs=document.createElement('canvas');wkCtx=wkCvs.getContext('2d');}
  wkCvs.width=VW;wkCvs.height=VH;
}

/* ───────────────────────────────────────────────────────────
   First-time hint — per-mode wording
   ─────────────────────────────────────────────────────────── */
const FIRST_HINT_KEYS = {
  auto: 'firstHintAuto',
  mouse: 'firstHintMouse',
  audio: 'firstHintAudio',
  tilt: 'firstHintTilt',
  motion: 'firstHintMotion',
  hand: 'firstHintHand',
  face: 'firstHintFace',
  flashlight: 'firstHintFlash',
  gaze: 'firstHintGaze',
  phone: 'firstHintPhone',
  ir: 'firstHintIR',
};
const COARSE = !!(window.matchMedia && window.matchMedia('(hover:none) and (pointer:coarse)').matches);
const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
/* 静观 — a real pause switch for the ambient animation (WCAG 2.2.2). */
function togglePause(){
  S.paused=!S.paused;
  flashHint(t(S.paused?'fxPauseOn':'fxPauseOff'));
}
document.addEventListener('keydown',e=>{
  if(S.running && (e.key||'').toLowerCase()==='p' && !e.shiftKey){ e.preventDefault(); togglePause(); }
});
function firstHintText(){
  return t(FIRST_HINT_KEYS[S.mode] || 'firstHintMouse');
}
function flashHint(text, dur=2800){
  const fh=document.getElementById('first-hint');
  fh.textContent=text;
  fh.classList.add('show');
  announce(text);
  clearTimeout(flashHint._t);
  flashHint._t=setTimeout(()=>fh.classList.remove('show'), dur);
}
/* Screen readers get every state change through one polite live region. */
let _annT=0;
function announce(text){
  const el=document.getElementById('live');
  if(!el) return;
  el.textContent='';
  clearTimeout(_annT);
  _annT=setTimeout(()=>{ el.textContent=text; },40);
}
function showFirstHint(){
  if(S.firstHintShown) return;
  S.firstHintShown=true;
  const el=document.getElementById('first-hint');
  el.textContent = firstHintText();
  setTimeout(()=>el.classList.add('show'), 900);
  setTimeout(()=>el.classList.remove('show'), 6000);
}
function noteFirstMove(dx,dy){
  S.firstMoveDistance += Math.hypot(dx,dy);
  if(S.firstMoveDistance > 80){
    const el=document.getElementById('first-hint');
    el.classList.remove('show');
  }
}

/* ───────────────────────────────────────────────────────────
   Start / Stop / Mode switch
   ─────────────────────────────────────────────────────────── */
/* A pixel budget keeps the canvas sharp on retina phones without turning a
   4K desk display into a 33 MP per-frame blit. 3.2 MP is the sweet spot:
   crisp text-free line art, still 60 fps for the particle layers. */
function computeDPR(){
  const raw=window.devicePixelRatio||1;
  const area=Math.max(1,window.innerWidth*window.innerHeight);
  const budget=3200000;
  return Math.max(1,Math.min(2,raw,Math.sqrt(budget/area)));
}
function radiusBounds(){ return [16*S.dpr, 340*S.dpr]; }
function clampRadius(v){ const b=radiusBounds(); return Math.max(b[0],Math.min(b[1],v)); }
function resizeCanvas(){
  DW=Math.round(window.innerWidth*S.dpr);
  DH=Math.round(window.innerHeight*S.dpr);
  D.width=DW;D.height=DH;
  S.mouseX=Math.min(S.mouseX,DW); S.mouseY=Math.min(S.mouseY,DH);
  initScene();
  drawScene(performance.now()/1000);
  target=scCvs; genHidden();
}
/* Ask for the camera that actually faces the user: hands, faces and shadows
   are self-portraits; only the flashlight wants to look at the room. */
async function ensureCam(){
  if(str && vid && vid.readyState>=2) return;
  await initCam(S.mode==='flashlight');
}
async function start(){
  const ss = document.getElementById('start-screen');
  ss.classList.add('leaving');
  await new Promise(r=>setTimeout(r,300));
  ss.style.display='none';

  S.dpr=computeDPR();
  resizeCanvas();
  S.mouseX=DW/2; S.mouseY=DH/2;
  S.radius=clampRadius(140*S.dpr);

  const m=M[S.mode];
  if(m.needCam){
    try{ await initCam(S.mode==='flashlight'); }
    catch(e){
      console.warn('Camera unavailable:',e.message);
      showError();
      ss.classList.remove('leaving'); ss.style.display='flex';
      return;
    }
  }
  m.init();
  S.running=true;S.smooth.x=S.smooth.y=-1;
  pip.style.display=m.needCam?'block':'none';
  document.getElementById('hsc').textContent=sceneNameOf(S.scene);
  sceneNav.classList.add('show');
  setTimeout(()=>sceneNav.classList.remove('show'), 2200);
  showFirstHint();
  showBar(true);
  wakeLockOn();
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  announce(`${t(m.nameKey)} · ${sceneNameOf(S.scene)}`);
  requestAnimationFrame(processFrame);
}
function stop(){
  S.running=false;M[S.mode].cln();S.transition.active=false;
  audioStop();
  if(str){str.getTracks().forEach(t=>t.stop());str=null;}
  if(vid){vid.srcObject=null;vid=null;}
  pip.style.display='none';sceneNav.classList.remove('show');
  hideBar();hideHelp();
  document.getElementById('first-hint').classList.remove('show');
  S.firstHintShown=false;S.firstMoveDistance=0;
  wakeLockOff();
  const ss=document.getElementById('start-screen');
  ss.classList.remove('leaving','ready');
  ss.style.display='flex';
  void ss.offsetWidth;
  requestAnimationFrame(()=>ss.classList.add('ready'));
  rebuildModeCards();
  announce(t('credit'));
}
async function wM(name,opts){
  if(!M[name]) return;
  const silent=!!(opts&&opts.silent);
  const prev=S.mode;
  if(S.running){
    M[prev].cln();
    S.delayBuf=[]; S.delayOut=null;               // 换模态清空延迟缓冲，避免回放上一种模式的光
    // leaving camera modes must release the camera: a pointer user should not keep
    // the camera light on (privacy), and the 15% ghost overlay should stop too.
    if(!M[name].needCam && str){
      try{ str.getTracks().forEach(t=>t.stop()); }catch(e){}
      str=null; vid=null; pip.style.display='none';
    }
    S.mode=name;S.smooth.x=S.smooth.y=-1;
    if(M[name].needCam && !str){
      try{ await initCam(name==='flashlight'); }
      catch(e){ console.warn('Camera reinit failed:',e.message); }
    }
    if(S.mode!==name) return;               // user switched again mid-await
    M[name].init();
    if(!silent) flashHint(firstHintText());
    S.firstMoveDistance = 0;
    pip.style.display = (M[name].needCam && str) ? 'block' : 'none';
    document.getElementById('he-row').style.display='none';
    refreshRoster();
    announce(t(M[name].nameKey));
    try{ history.replaceState(null,'',`?mode=${name}`); }catch(e){}
  }else{S.mode=name;}
  rebuildModeCards();
  buildHelpModes();
  showBar(true);
}

function showError(){
  document.getElementById('error-screen').classList.add('show');
}
function hideError(){
  document.getElementById('error-screen').classList.remove('show');
}

/* ═══════════════════════════════════════════════════════════
   RUNTIME UI — control bar, help sheet, kiosk niceties

let _barTimer=0;
function showBar(sticky){
  const bar=document.getElementById('bar');
  if(!bar) return;
  bar.classList.add('show');
  clearTimeout(_barTimer);
  const keep = sticky || COARSE || !S.running;
  if(!keep) _barTimer=setTimeout(()=>bar.classList.remove('show'), 4200);
}
function hideBar(){ const bar=document.getElementById('bar'); if(bar){ clearTimeout(_barTimer); bar.classList.remove('show'); } }
function noteActivity(){
  S.lastInput=performance.now();
  if(S.running && !document.getElementById('bar').classList.contains('show')) showBar();
}
function setStyle(st){
  if(!['edges','sketch','dark','paper'].includes(st)) return;
  S.style=st; genHidden(); syncBar();
  announce(t({edges:'styleEdges',sketch:'styleSketch',dark:'styleDark',paper:'stylePaper'}[st]));
}
function bumpRadius(d){
  S.radius=clampRadius(S.radius+d*S.dpr);
  flashHint(`◯ ${Math.round(S.radius/S.dpr)}`, 900);
}
function toggleFullscreen(){
  const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
  }else{
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req) Promise.resolve(req.call(el)).catch(()=>flashHint(t('fullUnsupported')));
    else flashHint(t('fullUnsupported'));
  }
  syncBar();
}
function togglePaint(){
  S.paint=!S.paint;
  flashHint(t(S.paint?'fxPaintOn':'fxPaintOff'));
  syncBar();
  vibrate(12);
}
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
/* keep the screen awake while the piece is on show (kiosk / gallery) */
let _wake=null;
async function wakeLockOn(){
  try{
    if('wakeLock' in navigator && !_wake){
      _wake=await navigator.wakeLock.request('screen');
      _wake.addEventListener('release',()=>{ _wake=null; });
    }
  }catch(e){ /* not supported / denied — harmless */ }
}
async function wakeLockOff(){ try{ if(_wake){ await _wake.release(); _wake=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.running) wakeLockOn(); });

function barIcon(name){ return `<svg viewBox="0 0 24 24" aria-hidden="true">${BAR_ICONS[name]||''}</svg>`; }
function syncBar(){
  const st={edges:'styleEdges',sketch:'styleSketch',dark:'styleDark',paper:'stylePaper'}[S.style];

const PRESET_LABEL={
  gallery:{zh:'日常',en:'daily'}, kiosk:{zh:'展厅',en:'kiosk'},
  stereo:{zh:'立体',en:'stereo'}, lab:{zh:'调参',en:'lab'},
};
function buildPresets(){
  const host=document.getElementById('presets'); if(!host) return;
  host.innerHTML='';
  for(const name of Object.keys(PRESETS)){
    const b=document.createElement('button');
    b.type='button'; b.dataset.preset=name;
    const lab=LANG==='en'?PRESET_LABEL[name].en:PRESET_LABEL[name].zh;
    b.innerHTML=`<b>${lab}</b> · preset=${name}`;
    b.setAttribute('aria-label',`preset ${name}`);
    b.addEventListener('click',()=>{
      applyPreset(name);
      [...host.children].forEach(c=>c.classList.toggle('on',c.dataset.preset===name));
      reboot();
    });
    host.appendChild(b);
  }
}
/* 预设改了之后要按新配置重启一次画面 */
async function reboot(){
  if(S.running) stop();
  await new Promise(r=>setTimeout(r,320));
  start();
}
function wireBar(){

document.addEventListener('keydown',e=>{

  const f=[...ov.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]

});

/* ═══════════════════════════════════════════════════════════
   INPUT — one pointer pipeline for mouse, finger and stylus.
   Touch carries no keyboard, so gestures are first-class:
     drag      → move the light
     pinch     → resize the aperture
     double-tap→ next scene
     long-press→ ink trails (留痕)
   ═══════════════════════════════════════════════════════════ */
const ptrs=new Map();
let pinchStart=0, pinchR=0, longPressT=0, lastTap=0, tapX=0, tapY=0;
function ptrDist(){
  const v=[...ptrs.values()];
  if(v.length<2) return 0;
  return Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
}
function setPtr(clientX,clientY){
  const x=clientX*S.dpr, y=clientY*S.dpr;
  const dx=x-S.mouseX, dy=y-S.mouseY;
  S.mouseX=x; S.mouseY=y;
  if(S.running) noteFirstMove(dx,dy);
  noteActivity();
}
D.addEventListener('pointerdown',e=>{
  if(!S.running) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  S.pointerDown=true;
  S.pen = e.pointerType==='pen';
  S.pressure = e.pressure||0;
  if(S.write){
    const dx=e.clientX-(S.writePx||e.clientX), dy=e.clientY-(S.writePy||e.clientY);
    const spd=Math.hypot(dx,dy)/Math.max(0.008,(e.timeStamp-(S.writeT||e.timeStamp))/1000);
    S.writeW=writeWidth(spd); S.writePx=e.clientX; S.writePy=e.clientY; S.writeT=e.timeStamp;
  }
  setPtr(e.clientX,e.clientY);
  showBar(true);
  if(ptrs.size===2){ clearTimeout(longPressT); pinchStart=ptrDist(); pinchR=S.radius; }
  else if(ptrs.size===1){
    clearTimeout(longPressT);
    if(COARSE || e.pointerType==='touch'){
      longPressT=setTimeout(()=>{ togglePaint(); longPressT=0; lastTap=0; }, 620);
    }
  }
  try{ D.setPointerCapture(e.pointerId); }catch(err){}
});
D.addEventListener('pointermove',e=>{
  if(!S.running) return;
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){
    const d=ptrDist();
    if(pinchStart>8 && d>8) S.radius=clampRadius(pinchR*(d/pinchStart));
    return;
  }
  S.pressure = e.pressure||0;
  if(e.pointerType==='pen'){ S.pen=true; S.ptilt={tx:e.tiltX||0, ty:e.tiltY||0}; }
  if(e.type==='pointerdown' && (S.ritual || S.summon)){
    const px=e.clientX*(DW/D.clientWidth), py=e.clientY*(DH/D.clientHeight);
    if(S.ritual && ritualTap(S.ritualTaps, px, py, performance.now())){
      S.ritualUntil=performance.now()+10000; S.ritualTaps.length=0;
      flashHint(t('fxRitual'), 1800);
    }
    if(S.summon){ S.summonDots.length=0; summonAdd(S.summonDots, px, py, 12); pushSplat(px,py,60,110); }
  }
  if(S.offering && e.type==='pointerdown'){
    offeringAdd(e.clientX*(DW/D.clientWidth), e.clientY*(DH/D.clientHeight), performance.now());
    flashHint(t('fxOffering'), 1200);
  }
  if(e.shiftKey && S.scene===6 && S.pointerDown){    // Shift+拖 = 绕轴旋转
    S.view.yaw=(S.view.yaw||0)+(e.movementX||0)*0.004;
    S.view.pitch=Math.max(-0.9,Math.min(0.9,(S.view.pitch||0)+(e.movementY||0)*0.004));
    noteActivity();
    return;
  }
  setPtr(e.clientX,e.clientY);
  if(longPressT){ clearTimeout(longPressT); longPressT=0; }
});
function endPtr(e){
  if(!S.running) return;
  const had=ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchStart=0;
  if(ptrs.size===0){
    S.pointerDown=false; S.pressure=0;
    clearTimeout(longPressT); longPressT=0;
    if(had && (COARSE||e.pointerType==='touch') && e.type==='pointerup'){
      const now=performance.now();
      const moved=Math.hypot((e.clientX*S.dpr)-tapX,(e.clientY*S.dpr)-tapY);
      if(now-lastTap<320 && moved<30*S.dpr){ changeScene((S.scene+1)%SCENE_COUNT); lastTap=0; }
      else { lastTap=now; tapX=e.clientX*S.dpr; tapY=e.clientY*S.dpr; }
    }
  }
}
D.addEventListener('dblclick',e=>{
  if(!S.running||S.scene!==6) return;
  S.view.frozen=!S.view.frozen;
  flashHint(t(S.view.frozen?'fxFreezeOn':'fxFreezeOff'), 1200);
});
D.addEventListener('pointerup',endPtr);
D.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); S.pointerDown=false; clearTimeout(longPressT); });
D.addEventListener('wheel',e=>{
  if(!S.running) return;
  e.preventDefault();
  if(S.mode==='scroll'){                             // 滚轮模式：累积量当坐标
    S.scroll.acc+=(e.deltaY>0?1:-1)*(e.deltaMode===1?3:1);
    S.scroll.v=Math.min(60, S.scroll.v+Math.abs(e.deltaY>0?e.deltaY:e.deltaY)*0.4);
    noteActivity();
  }
  if(S.scene===6){                                   // 点云：滚轮 = 推拉镜头
    S.view.zoom=Math.max(0.55,Math.min(2.4, (S.view.zoom||1)*(e.deltaY>0?0.92:1.08)));
    noteActivity();
    return;
  }
  const unit=e.deltaMode===1?16:(e.deltaMode===2?window.innerHeight:1);
  S.radius=clampRadius(S.radius+e.deltaY*unit*0.25*S.dpr);
  noteActivity();
},{passive:false});

    case'i':togglePaint();break;
    case'o':S.paintFade=S.paintFade?0:0.01;flashHint(t(S.paintFade?'fxFadeOn':'fxFadeOff'));break;
    case'g':if(e.shiftKey&&S.wall){ S.grid=!S.grid; flashHint(S.grid?'grid on':'grid off',900); break; }
      S.glow=!S.glow;if(!S.glow&&glowCtx)glowCtx.clearRect(0,0,glowCvs.width,glowCvs.height);flashHint(t(S.glow?'fxGlowOn':'fxGlowOff'));break;
    case's':savePNG();break;
    case'k':S.creature=!S.creature;flashHint(t(S.creature?'fxCreatureOn':'fxCreatureOff'));break;
    case'y':S.mirror=!S.mirror;flashHint(t(S.mirror?'fxMirrorOn':'fxMirrorOff'));break;
    case't':S.timeTint=!S.timeTint;flashHint(t(S.timeTint?'fxTintOn':'fxTintOff'));break;
    case'u':toggleRoom();break;
    case'a':toggleAmbient();break;
    case'b':S.beat.on=!S.beat.on;S.beat.t0=performance.now();flashHint(t(S.beat.on?'fxBeatOn':'fxBeatOff'));break;
    case'x':S.mirrorX=!S.mirrorX;flashHint(S.mirrorX?'⇄':'⇆',700);break;
    case'd':if(e.shiftKey){

});

/* ───────────────────────────────────────────────────────────
   Mode card builder
   ─────────────────────────────────────────────────────────── */
const mg=document.getElementById('mg');
/* Grouped by hardware requirement, so nobody has to discover the hard way
   that "gaze" wants a printed marker. Order = easiest first. */
const MODE_GROUPS=[
  {label:'groupFree',  modes:['auto','mouse','multi','keys','pen','scroll','battery','pentilt','noise','beat','hours','clip','inkpick','presence','screens','kiosk','load','whistle','dwell','breath','blow','audio','clap','speech','tilt','shake','light']},
  {label:'groupCam',   modes:['motion','hand','face','eyes','flashlight']},
  {label:'groupGear',  modes:['gamepad','midi','hid','ble','nfc','gaze','phone','ir']},
  {label:'groupLocal', modes:['osc','bridge']},
];
/* 永远展示：不支持就让用户进去看提示，而不是凭空消失 ——
   否则每个浏览器看到的是不同的作品，这不算"全部展示"。 */
function modeAvailable(k){ return !!M[k]; }
/* 只影响卡片上的小字（"可能不支持"），不影响是否显示 */
function modeSupported(k){
  if(k==='ir') return 'serial' in navigator;
  if(k==='gamepad') return 'getGamepads' in navigator;
  if(k==='midi') return 'requestMIDIAccess' in navigator;
  if(k==='speech') return !!(window.SpeechRecognition||window.webkitSpeechRecognition);
  if(k==='hid') return 'hid' in navigator;
  if(k==='ble') return 'bluetooth' in navigator;
  if(k==='nfc') return 'NDEFReader' in window;
  if(k==='osc'||k==='bridge') return 'EventSource' in window;
  if(k==='light') return 'AmbientLightSensor' in window;
  if(k==='pulse') return !!navigator.mediaDevices;
  return true;
}
function modeReqKey(k){
  const m=M[k];
  if(m.needMic) return 'reqMic';
  if(m.needCam) return 'reqCam';
  if(m.group==='gear') return 'reqGear';
  return 'reqNone';
}
function rebuildModeCards(){
  mg.innerHTML='';
  for(const g of MODE_GROUPS){
    const modes=g.modes.filter(modeAvailable);
    if(!modes.length) continue;
    const box=document.createElement('div');
    box.className='mode-group';
    const label=document.createElement('div');
    label.className='cat-label';
    label.innerHTML=`<span>${t(g.label)}</span>`;
    box.appendChild(label);
    const grid=document.createElement('div');
    grid.className='mode-grid';
    for(const k of modes){
      const m=M[k];
      const c=document.createElement('button');
      c.type='button';
      c.className='mode-card'+(k===S.mode?' active':'');
      c.dataset.mode=k;
      c.setAttribute('aria-pressed',k===S.mode?'true':'false');
      c.setAttribute('aria-label',`${t(m.nameKey)} — ${t(modeReqKey(k))}`);
      const supported=modeSupported(k);
      if(!supported) c.classList.add('unsupported');
      c.innerHTML=`<span class="icon">${iconSvg(m.icon)}</span><span class="name">${t(m.nameKey)}</span>`
        +`<span class="req">${supported?t(modeReqKey(k)):t('reqMaybe')}</span>`;
      c.addEventListener('click',()=>{ showBar(true); wM(k); });
      grid.appendChild(c);
    }
    box.appendChild(grid);
    mg.appendChild(box);
  }
}

    if(q.get('grid')==='1'){ S.grid=true; }
    if(q.get('accrete')==='0'){ S.accrete=false; }
    const form=q.get('form');
    if(form==='together'||form==='together2'){ S.together=true; S.togetherNeed=form==='together2'?3:2; }
    if(form==='delay'){ S.delayMs=8000; }
    if(form==='daily'){ S.daily={on:true, seed:dailySeed().key}; }
    if(form==='silence'){ S.silence.on=true; }
    if(form==='offering'){ S.offering=true; }
    if(form==='repel'){ S.repel=true; }
    if(form==='summon'){ S.summon=true; }
    if(form==='write'){ S.write=true; }
    if(form==='ritual'){ S.ritual=true; }
    const dl=parseInt(q.get('delay')||'0',10);
    if(dl>0&&dl<=30000){ S.delayMs=dl; S.delayBuf=[]; }
    if(q.get('daily')==='1'){ S.daily={on:true, seed:dailySeed().key}; }
    const pre=q.get('preset'); if(pre) applyPreset(pre);
    const st2=q.get('stereo');
    if(st2==='anaglyph'||st2==='sbs'){ S.stereo=st2; }
    DEEP_PLAY = q.has('mode') || q.has('play') || S.wall;
    const md=q.get('mode');
    if(md && M[md] && modeAvailable(md)) S.mode=md;
    else if(!md) S.mode=pickDefaultMode();      // phone → multi-touch, wall → attract, desk → pointer
    const sc=parseInt(q.get('scene'),10);
    if(isFinite(sc)) S.scene=Math.max(0,Math.min(SCENE_COUNT-1,sc));
    const st=q.get('style');
    if(st && ['edges','sketch','dark','paper'].includes(st)) S.style=st;
    const lg=q.get('lang');
    if(lg && I18N[lg]) LANG=lg;
    if(q.get('debug')==='1') S.debug=true;
    if(q.get('effects')==='1'){ S.paint=true;S.glow=true;S.mirror=true;S.timeTint=true; }
    const vid2=q.get('video'); if(vid2) videoAttach(vid2);
  }catch(e){}
}

/* Initial translations + preload + reveal */
applyDeepLink();
applyTranslations();
rebuildModeCards();
buildHelpModes();
buildPresets();
wireBar();
preloadImages().then(()=>{
  // Hide loading, reveal start screen
  document.getElementById('loading').classList.add('gone');
  const ss=document.getElementById('start-screen');
  ss.classList.add('ready');
  setTimeout(()=>{ document.getElementById('loading').style.display='none'; }, 700);
  if(DEEP_PLAY) setTimeout(()=>{ start(); }, 700);   // a shared link plays itself
}).catch(e=>{
  console.warn('Preload error:', e);
  document.getElementById('loading').classList.add('gone');
  document.getElementById('start-screen').classList.add('ready');
});
</script>
</body>
