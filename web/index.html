/* ═══════════════════════════════════════════════════════════
   SENSOR ENGINES — everything here runs on hardware people
   already own (built-in mic, built-in webcam, the phone's own
   tilt sensor). No printer, no marker, no relay, no plugin.
   ═══════════════════════════════════════════════════════════ */

/* ── 声音 · 吟诵 ── loudness → radius, pitch → x, timbre → y, transient → ink splat */
function audioStart(){
  const A=S.audio;
  if(A.on) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ audioFail(); return; }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
    .then(st=>{
      if(S.running && !(M[S.mode]&&M[S.mode].needMic)){ try{st.getTracks().forEach(x=>x.stop());}catch(e){} return; }
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C){ audioFail(); return; }
      A.stream=st;
      A.ctx=new C();
      if(A.ctx.state==='suspended'){ A.ctx.resume().catch(()=>{}); }
      A.src=A.ctx.createMediaStreamSource(st);
      A.ana=A.ctx.createAnalyser();
      A.ana.fftSize=2048;
      A.ana.smoothingTimeConstant=.65;
      A.src.connect(A.ana);
      A.buf=new Uint8Array(A.ana.fftSize);
      A.freq=new Uint8Array(A.ana.frequencyBinCount);
      A.sr=A.ctx.sampleRate;
      A.level=0;A.pitch=0;A.centroid=.5;A.t=0;A.hit=0;A.nx=.5;A.on=true;
      audioLoop();
    })
    .catch(()=>audioFail());
}
function audioFail(){
  flashHint(t('audioDenied'));
  if(S.running && S.mode==='audio') wM('mouse',{silent:true});
}
function audioStop(){
  const A=S.audio; A.on=false;
  try{A.stream&&A.stream.getTracks().forEach(x=>x.stop());}catch(e){}
  try{A.ctx&&A.ctx.close();}catch(e){}
  A.stream=null;A.ctx=null;A.ana=null;A.src=null;A.level=0;A.pitch=0;A.nx=.5;
}
function audioLoop(){
  const A=S.audio;
  if(!A.on||!A.ana) return;
  A.ana.getByteTimeDomainData(A.buf);
  let sum=0,peak=0;
  for(let i=0;i<A.buf.length;i++){ const v=(A.buf[i]-128)/128; sum+=v*v; const av=v<0?-v:v; if(av>peak)peak=av; }
  const rms=Math.sqrt(sum/A.buf.length);
  A.rms=rms;
  const target=clampN((rms-0.006)*7,0,1);
  A.level=A.level*.72+target*.28;
  A.peak=peak;
  if(peak>0.30 && performance.now()-(A.hit||0)>380){
    A.hit=performance.now();
    const sp=audioSpot(); if(sp) pushSplat(sp.x, sp.y, 34+A.level*46, 90);
    if(S.mode==='clap') clapOnset();
  }
  A.ana.getByteFrequencyData(A.freq);
  let num=0,den=0;
  for(let i=2;i<A.freq.length;i++){ const v=A.freq[i]; num+=i*v; den+=v; }
  if(den>200){ A.centroid=A.centroid*.86+clampN((num/den)/(A.freq.length*.5),0,1)*.14; }
  A.t+=0.016;
  A.frame=(A.frame||0)+1;
  if(A.frame%5===0) audioPitch();
  requestAnimationFrame(audioLoop);
}
/* autocorrelation pitch: decimate by 3 so a 2048-sample frame costs ~150k ops */
function audioPitch(){
  const A=S.audio,b=A.buf,sr=A.sr||44100,d=3,n=b.length;
  if(!b||(A.rms||0)<0.004){ A.pitch=0; return; }
  const e=new Float64Array(n+1);
  for(let i=0;i<n;i++){ const v=b[i]-128; e[i+1]=e[i]+v*v; }
  const minLag=Math.max(4,Math.round(sr/(1000*d))), maxLag=Math.min(Math.floor(n/(2*d)),Math.round(sr/(85*d)));
  let best=0,bestLag=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let c=0,lim=n-lag*d;
    for(let i=0;i<lim;i+=2){ c+=(b[i]-128)*(b[i+lag*d]-128); }
    c*=2;
    const e2=e[n]-e[lag*d-1];
    const norm=c/(Math.sqrt((e[n]-e[0])*e2)+1e-6);
    if(norm>best){ best=norm; bestLag=lag; }
  }
  A.pitch = (best>0.32 && bestLag>0) ? sr/(bestLag*d) : 0;
}
function audioSpot(){
  const A=S.audio;
  if(!A.on) return null;
  const raw = A.pitch ? clampN(Math.log2(A.pitch/85)/Math.log2(1400/85),0,1) : .5;
  A.nx = A.nx==null ? raw : A.nx*.78+raw*.22;
  const yN = clampN(A.centroid*.72 + .28*(.5+.5*Math.sin(A.t*.55)),0,1);
  return {x:DW*(.07+.86*A.nx), y:DH*(.12+.76*yN), radius:S.radius*(.42+A.level*1.75)};
}

/* ── 动影 · 皮影 ── frame differencing, zero models. The centroid of CHANGE
   becomes the light: you do not need to be recognised, just to move. */
const MOTION_W=72, MOTION_H=54;
function motionReset(){ const m=S.motion; m.prev=null; m.level=0; m.x=DW/2; m.y=DH/2; m.nx=.5; m.ny=.5; m.seen=false; m.t=0; }
function motionTick(){
  const m=S.motion;
  if(!wkCvs||!vid||vid.readyState<2) return;
  const now=performance.now();
  if(now-m.t<45) return;
  m.t=now;
  if(!m.c){
    m.c=document.createElement('canvas'); m.c.width=MOTION_W; m.c.height=MOTION_H;
    m.cx=m.c.getContext('2d',{willReadFrequently:true});
  }
  m.cx.drawImage(wkCvs,0,0,MOTION_W,MOTION_H);
  const cur=m.cx.getImageData(0,0,MOTION_W,MOTION_H).data;
  const prev=m.prev;
  m.prev=cur;
  if(!prev) return;
  let sw=0,sx=0,sy=0,energy=0;
  for(let y=0;y<MOTION_H;y++){
    for(let x=0;x<MOTION_W;x++){
      const i=(y*MOTION_W+x)*4;
      const l=cur[i]*.299+cur[i+1]*.587+cur[i+2]*.114;
      const pl=prev[i]*.299+prev[i+1]*.587+prev[i+2]*.114;
      const d=l-pl; const ad=d<0?-d:d;
      if(ad>9){ const w=ad-9; sw+=w; sx+=x*w; sy+=y*w; energy+=ad; }
    }
  }
  const area=MOTION_W*MOTION_H;
  m.level=clampN(energy/(area*26),0,1);
  if(sw>area*0.35){
    let nx=sx/sw/MOTION_W, ny=sy/sw/MOTION_H;
    if(S.mirrorX) nx=1-nx;                       // the preview is mirrored → match it
    m.nx=m.nx*.7+nx*.3;
    m.ny=m.ny*.7+ny*.3;
    m.seen=true;
    m.x=m.nx*DW; m.y=m.ny*DH;
  }
}

/* ── 面庞 · 头姿 ── MediaPipe FaceMesh: nose tip moves the light, an open
   mouth opens the aperture. Head pose, not eye gaze — no printed marker. */
let fm=null, fmLoading=null, fmBusy=false;
function loadFaceMesh(){
  if(window.FaceMesh) return Promise.resolve();
  if(fmLoading) return fmLoading;
  fmLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js';
    s.async=true;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error('face_mesh.js failed to load'));
    document.head.appendChild(s);
  });
  return fmLoading;
}
async function faceStart(){
  const F=S.face;
  flashHint(t('faceLoading'), 5000);
  try{ await loadFaceMesh(); }catch(e){ console.warn('[face]',e.message); faceFail(); return; }
  if(!S.running || S.mode!=='face'){ return; }
  try{
    if(!fm){
      fm=new FaceMesh({locateFile:mpLocate});
      fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
      fm.onResults(r=>{
        const lms=r.multiFaceLandmarks&&r.multiFaceLandmarks[0];
        const F2=S.face;
        if(!lms){ F2.seen=false; F2.open=0; return; }
        const nose=lms[4], up=lms[13], dn=lms[14], le=lms[33], re=lms[263];
        const eyeD=Math.hypot(re.x-le.x, re.y-le.y)||1e-3;
        F2.open=clampN((Math.hypot(dn.x-up.x, dn.y-up.y)/eyeD-0.06)/0.5,0,1);
        F2.z=nose.z||0;                       // 鼻尖深度：头往前凑 → 更负
        try{
          S.eyes.ear=(earOf(lms,[33,160,158,133,153,144])+earOf(lms,[362,385,387,263,373,380]))/2;
          eyesTick();
        }catch(e){}
        let nx=nose.x, ny=nose.y;
        if(S.mirrorX) nx=1-nx;
        F2.nx=F2.nx==null?nx:F2.nx*.55+nx*.45;
        F2.ny=F2.ny==null?ny:F2.ny*.55+ny*.45;
        F2.seen=true;
      });
    }
    if(S.mode!=='face'){ return; }
    F.ready=true;
    F.loading=false;
  }catch(e){ console.warn('[face] init',e); faceFail(); }
}
function faceFail(){
  S.face.ready=false;
  flashHint(t('faceFail'));
  if(S.running && S.mode==='face') wM('mouse',{silent:true});
}
function faceStop(){ S.face.ready=false; S.face.seen=false; S.face.nx=null; S.face.ny=null; }
let _fmBusy=false;
async function faceTick(){
  if((S.mode!=='face'&&S.mode!=='eyes')||!fm||!S.face.ready||_fmBusy||!wkCvs) return;
  _fmBusy=true;
  try{ await fm.send({image:wkCvs}); }catch(e){ /* transient */ }finally{ _fmBusy=false; }
}

/* ── 倾斜 · 掌中 ── the phone's own gyroscope. iOS needs an explicit
   permission request triggered by a user gesture (the mode card click). */
function tiltStart(){
  const T=S.tilt;
  T.ready=false; T.base=null; T.last=0; T.sx=null; T.sy=null;
  const attach=()=>{ window.addEventListener('deviceorientation',tiltHandler,true); T.bound=true; };
  const DOE=window.DeviceOrientationEvent;
  try{
    if(DOE && typeof DOE.requestPermission==='function'){
      DOE.requestPermission().then(p=>{ if(p==='granted') attach(); else tiltFail(); }).catch(()=>tiltFail());
    }else attach();
  }catch(e){ tiltFail(); return; }
  clearTimeout(T.timer);
  T.timer=setTimeout(()=>{ if(S.running && S.mode==='tilt' && !T.ready) tiltFail(); }, 2800);
}
function tiltHandler(e){
  const T=S.tilt;
  if(e.beta==null && e.gamma==null) return;
  T.last=performance.now();
  T.beta=+e.beta||0; T.gamma=+e.gamma||0;
  if(!T.base){
    T.base={beta:T.beta,gamma:T.gamma};
    T.ready=true;
    flashHint(t('tiltCenter'), 1600);
  }
}
function tiltFail(){
  flashHint(t('tiltNoSensor'));
  if(S.running && S.mode==='tilt') wM('mouse',{silent:true});
}
function tiltStop(){
  const T=S.tilt;
  try{ window.removeEventListener('deviceorientation',tiltHandler,true); }catch(e){}
  clearTimeout(T.timer);
  T.ready=false; T.bound=false;
}
function tiltRecenter(){
  const T=S.tilt;
  T.base = (T.beta!=null) ? {beta:T.beta,gamma:T.gamma} : null;
  flashHint(t('tiltRecentered'), 1400);
}


/* ═══════════════════════════════════════════════════════════
   SECOND WAVE OF SENSOR ENGINES
   Tier 1 = nothing but the machine you already have
   Tier 2 = a device you plug in (gamepad, MIDI, serial)
   Tier 3 = a small local script (OSC / TouchDesigner bridge)
   ═══════════════════════════════════════════════════════════ */

/* ── 键盘 · 无鼠标也能玩（无障碍主干） ── */
const KEYS=new Set();
window.addEventListener('keydown',e=>{ KEYS.add((e.key||'').toLowerCase()); },true);
window.addEventListener('keyup',e=>{ KEYS.delete((e.key||'').toLowerCase()); },true);
window.addEventListener('blur',()=>KEYS.clear());
const KEY_ACTS=['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d',' ','shift'];
function keysInit(){ S.keys={x:DW/2,y:DH/2,vx:0,vy:0,pulse:0}; }
function keysSpot(){
  const k=KEYS, K=S.keys;
  const ax=(k.has('arrowright')||k.has('d')?1:0)-(k.has('arrowleft')||k.has('a')?1:0);
  const ay=(k.has('arrowdown')||k.has('s')?1:0)-(k.has('arrowup')||k.has('w')?1:0);
  const acc=(k.has('shift')?2600:1300)*S.dpr;      // px / s²
  const damp=k.size?0.88:0.80;
  K.vx=(K.vx+ax*acc/60)*damp; K.vy=(K.vy+ay*acc/60)*damp;
  K.x=clampN(K.x+K.vx/60,0,DW); K.y=clampN(K.y+K.vy/60,0,DH);
  if(K.pulse>0){ K.pulse-=0.04; pushSplat(K.x,K.y,50+40*K.pulse,90); }
  return {x:K.x, y:K.y, radius:S.radius*(k.has('shift')?1.3:1)};
}

/* ── 多指 · 大触摸屏上每一根手指都是一盏灯 ── */
function multiSpots(){
  if(!ptrs.size) return [{x:S.mouseX, y:S.mouseY, radius:S.radius*0.6}];
  const out=[];
  for(const p of ptrs.values()) out.push({x:p.x*S.dpr, y:p.y*S.dpr, radius:S.radius*0.6});
  return out.slice(0,6);
}

/* ── 吐纳 · 只用麦克风的低频包络（呼吸），不用音高 ── */
function breathLevel(){
  const A=S.audio;
  if(!A.on||!A.freq) return 0;
  let sum=0; const n=Math.max(3,Math.round(420/(A.sr/ (A.ana?A.ana.fftSize:2048))));
  for(let i=1;i<=n && i<A.freq.length;i++) sum+=A.freq[i];
  const low=clampN((sum/n)/160,0,1);
  const B=S.breath2;
  B.smooth=B.smooth*0.92+low*0.08;                   // ~2 s window = a calm breath
  return B.smooth;
}

/* ── 语音 · Web Speech API 关键词（Chrome/Edge；Safari 受限） ── */
const SPEECH_WORDS=[
  {re:/(山|水|峰|mount|peak)/i, act:()=>changeScene(0)},
  {re:/(竹|林|bamboo)/i, act:()=>changeScene(1)},
  {re:/(雪|冬|寒|snow|winter)/i, act:()=>changeScene(2)},
  {re:/(花|鸟|春|blossom|flower|bird)/i, act:()=>changeScene(3)},
  {re:/(星|夜|空|star|night)/i, act:()=>changeScene(4)},
  {re:/(亮|开|大|open|bigger|wider)/i, act:()=>{ S.radius=clampRadius(S.radius+40*S.dpr); flashHint('◯ '+Math.round(S.radius/S.dpr),900); }},
  {re:/(暗|关|小|close|smaller|narrow)/i, act:()=>{ S.radius=clampRadius(S.radius-40*S.dpr); flashHint('◯ '+Math.round(S.radius/S.dpr),900); }},
  {re:/(留痕|墨迹|trail|ink)/i, act:()=>togglePaint()},
  {re:/(泼墨|splash|bloom)/i, act:()=>pushSplat(S.mouseX,S.mouseY,70,120)},
];
function speechStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ flashHint(t('fxSpeechFail')); if(S.running&&S.mode==='speech') wM('mouse',{silent:true}); return; }
  if(S.speech.on) return;
  const r=new SR();
  r.lang = LANG==='en' ? 'en-US' : (LANG==='zh-TW' ? 'zh-TW' : 'zh-CN');
  r.continuous=true; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    const txt=(res&&res[0]&&res[0].transcript)||'';
    S.speech.last=txt;
    for(const w of SPEECH_WORDS) if(w.re.test(txt)){ w.act(); flashHint('🗣 '+txt.slice(0,12)); break; }
  };
  r.onerror=()=>{};
  r.onend=()=>{ if(S.mode==='speech'&&S.speech.rec===r){ try{ r.start(); }catch(e){} } };
  try{ r.start(); S.speech={rec:r,on:true,last:''}; }
  catch(e){ S.speech={rec:null,on:false,last:''}; flashHint(t('fxSpeechFail')); }
}
function speechStop(){ const sp=S.speech; sp.on=false; try{ sp.rec&&sp.rec.stop(); }catch(e){} sp.rec=null; }

/* ── 凝视停留 · hover 1.4 s 触发一次（不需要点击，行动不便也能用） ── */
function dwellTick(){
  const d=S.dwell, now=performance.now();
  const moved=Math.hypot(S.mouseX-d.x, S.mouseY-d.y);
  if(moved>26*S.dpr){ d.x=S.mouseX; d.y=S.mouseY; d.t=now; return; }
  if(now-d.t>1400 && now-d.cool>2600){
    d.cool=now; d.t=now;
    pushSplat(S.mouseX,S.mouseY,58,110);
    changeScene((S.scene+1)%SCENE_COUNT);
    vibrate(10);
  }
}

/* ── 摇一摇 · DeviceMotion（手机，无需摄像头） ── */
function shakeStart(){
  S.shake.last=0;
  const h=e=>{
    const a=e.accelerationIncludingGravity||e.acceleration; if(!a) return;
    const mag=Math.hypot(a.x||0,a.y||0,a.z||0); S.shake.mag=mag;
    const now=performance.now();
    if(mag>16 && now-S.shake.last>520){
      S.shake.last=now;
      pushSplat(S.mouseX,S.mouseY,64+Math.min(60,mag),120);
      vibrate(18);
    }
  };
  S.shake.h=h; S.shake.bound=true;
  window.addEventListener('devicemotion',h,true);
  setTimeout(()=>{ if(S.running&&S.mode==='shake'&&S.shake.mag===0) flashHint(t('fxShakeNoSensor')); },2600);
}
function shakeStop(){
  const h=S.shake.h;
  if(h) try{ window.removeEventListener('devicemotion',h,true); }catch(e){}
  S.shake.h=null; S.shake.bound=false;
}

/* ── 手柄 · Gamepad API（插上就能用，拔掉自动回落） ── */
function gamepadPoll(){
  const G=S.gamepad;
  let gp=null;
  try{ const list=navigator.getGamepads?navigator.getGamepads():[]; for(const g of list) if(g&&g.connected){ gp=g; break; } }catch(e){}
  if(!gp){ G.seen=false; return null; }
  if(!G.seen){ G.seen=true; G.x=(G.x||DW/2); G.y=(G.y||DH/2); announce(t('modeGamepad')); }
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
  const speed=1400*S.dpr;
  G.x=clampN(G.x+ax*speed/60, 0, DW);
  G.y=clampN(G.y+ay*speed/60, 0, DH);
  const rt=(gp.buttons[7]&&gp.buttons[7].value)||0;      // RT = wider
  const lt=(gp.buttons[6]&&gp.buttons[6].value)||0;      // LT = narrower
  G.r=clampN(G.r+(rt-lt)*0.06, 0.25, 2.6);
  const edge=(i)=>{ const b=gp.buttons[i]; const now=!!(b&&b.pressed); const was=!!G.btn[i]; G.btn[i]=now; return now&&!was; };
  if(edge(0)) changeScene((S.scene+1)%SCENE_COUNT);                // A
  if(edge(1)) pushSplat(G.x,G.y,70,110);                 // B
  if(edge(3)) togglePaint();                             // Y
  return {x:G.x, y:G.y, radius:S.radius*G.r};
}

/* ── MIDI · Web MIDI（推子/旋钮/打击垫） ── */
function midiMsg(m){
  const d=m.data||[]; if(d.length<2) return;
  const st=d[0]&0xf0, a=d[1], b=d[2]||0, M2=S.midi;
  if(st===0xb0){                                    // control change
    if(a===1) M2.nx=b/127;
    else if(a===2) M2.ny=b/127;
    else if(a===7) M2.r=0.25+(b/127)*2.2;
    else { M2.nx=b/127; M2.ny=1-(b/127); }
    M2.seen=true;
  }else if(st===0x90&&b>0){                         // note on
    M2.seen=true;
    if(a===36) pushSplat(M2.nx*DW,M2.ny*DH,70,110);
    else changeScene(a%SCENE_COUNT);
  }
}
async function midiStart(){
  if(!navigator.requestMIDIAccess){ flashHint(t('fxNoMidi')); if(S.running&&S.mode==='midi') wM('mouse',{silent:true}); return; }
  try{
    const acc=await navigator.requestMIDIAccess({sysex:false});
    S.midi.acc=acc;
    const hook=()=>{ for(const i of acc.inputs.values()) i.onmidimessage=midiMsg; };
    hook(); acc.onstatechange=hook;
    flashHint(t('fxMidiOn'));
  }catch(e){ flashHint(t('fxNoMidi')); if(S.running&&S.mode==='midi') wM('mouse',{silent:true}); }
}
function midiStop(){ const M2=S.midi; try{ if(M2.acc) for(const i of M2.acc.inputs.values()) i.onmidimessage=null; }catch(e){} M2.acc=null; M2.seen=false; }

/* ── OSC · 本地脚本 / TouchDesigner / Max（Tier 3：装个 server.py 就行） ── */
function oscStart(){
  const O=S.osc;
  if(O.es){ try{O.es.close();}catch(e){} O.es=null; }
  O.ok=false; O.t=0;
  try{
    O.es=new EventSource(`/events?room=osc`);
    O.es.onopen=()=>{ O.ok=true; flashHint(t('fxOscOk')); };
    O.es.onerror=()=>{ O.ok=false; };
    O.es.onmessage=e=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(typeof m.x==='number') O.x=clampN(m.x,0,1);
      if(typeof m.y==='number') O.y=clampN(m.y,0,1);
      if(typeof m.z==='number') O.z=clampN(m.z,0,1);
      if(typeof m.r==='number') O.r=clampN(m.r,0.02,3);
      if(m.scene!==undefined) changeScene(((m.scene|0)%SCENE_COUNT+SCENE_COUNT)%SCENE_COUNT);
      if(m.style!==undefined) setStyle(['edges','sketch','dark','paper'][(m.style|0)%4]);
      O.t=performance.now();
    };
  }catch(e){ flashHint(t('fxOscWait')); }
}
function oscStop(){ const O=S.osc; try{ O.es&&O.es.close(); }catch(e){} O.es=null; O.ok=false; }


/* ═══════════════════════════════════════════════════════════
   THIRD WAVE — the "plug something in" basket, plus content types.
   Every one of these degrades to the pointer when the hardware,
   the permission or the local bridge is missing.
   ═══════════════════════════════════════════════════════════ */

/* ── 通用 HID（WebHID）：Joy-Con / Wiimote / DIY 摇杆 ──
   已知设备按厂商解析，未知设备走"万能魔杖协议"：前 3 个字节当 x,y,r（0–255）。 */
function hidStart(){
  if(!('hid' in navigator)){ flashHint(t('fxHidWait')); return; }
  navigator.hid.requestDevice({filters:[]}).then(async devs=>{
    if(!devs||!devs.length){ flashHint(t('fxHidWait')); return; }
    const dev=devs[0];
    if(!dev.opened) await dev.open();
    S.hid={dev:dev, seen:false, x:.5, y:.5, r:.5, raw:''};
    dev.addEventListener('inputreport',hidReport);
    flashHint(t('fxHidOk')+' · '+(dev.productName||'HID'));
  }).catch(()=>{ flashHint(t('fxHidWait')); });
}
function hidReport(e){
  const H=S.hid; if(!H) return;
  try{
    const d=e.data, vid=H.dev&&H.dev.vendorId;
    let x=null,y=null,r=null;
    if(vid===0x057E && d.byteLength>=11){                 // Joy-Con (Nintendo)
      x=d.getUint8(6)/255; y=d.getUint8(7)/255;
      if(d.getUint8(3)&0x01) pushSplat(x*DW,y*DH,60,110); // ZL as a pulse
    }else if(d.byteLength>=3){                            // generic wand: x,y,r bytes
      x=d.getUint8(0)/255; y=d.getUint8(1)/255; r=0.25+d.getUint8(2)/255*2;
    }
    if(x!==null){ H.x=x; H.y=y; H.r=r||H.r; H.seen=true; }
  }catch(err){}
}
function hidStop(){ const H=S.hid; try{ H&&H.dev&&H.dev.close&&H.dev.close(); }catch(e){} S.hid=null; }

/* ── 蓝牙（Web Bluetooth）：心率带 / Muse EEG / DIY ESP32 ── */
async function bleStart(){
  if(!navigator.bluetooth){ flashHint(t('fxBleWait')); return; }
  try{
    const dev=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['heart_rate','battery_service','generic_access','0000ffe0-0000-1000-8000-00805f9b34fb'],
    });
    const srv=await dev.gatt.connect();
    const srvs=await srv.getPrimaryServices();
    let hooked=false;
    for(const sv of srvs){
      const chars=await sv.getCharacteristics().catch(()=>[]);
      for(const ch of chars){
        if(!ch.properties.notify&&!ch.properties.indicate) continue;
        await ch.startNotifications().catch(()=>{});
        ch.addEventListener('characteristicvaluechanged',bleValue);
        hooked=true; break;
      }
      if(hooked) break;
    }
    S.ble={dev:dev, seen:false, x:.5, y:.5, r:.5, hr:0, hooked:hooked};
    flashHint(t('fxBleOk')+(hooked?'':' · no notify'));
  }catch(e){ flashHint(t('fxBleWait')); }
}
function bleValue(e){
  const B=S.ble; if(!B) return;
  const dv=e.target.value; if(!dv) return;
  try{
    if(e.target.uuid&&/2a37/i.test(e.target.uuid)){        // Heart Rate Measurement
      const flags=dv.getUint8(0);
      const hr=(flags&1)?dv.getUint16(1,true):dv.getUint8(1);
      B.hr=hr; B.seen=true;
      B.r=clampN(0.35+hr/160,0.35,2.2);
      return;
    }
    if(dv.byteLength>=3){
      B.x=dv.getUint8(0)/255; B.y=dv.getUint8(1)/255;
      B.r=0.25+dv.getUint8(2)/255*2; B.seen=true;
    }
  }catch(err){}
}
function bleStop(){ const B=S.ble; try{ B&&B.dev&&B.dev.gatt&&B.dev.gatt.connected&&B.dev.gatt.disconnect(); }catch(e){} S.ble=null; }

/* ── 通用外设桥（Tier 3）：任何本地脚本 POST JSON 就能驱动 ──
   覆盖 Leap Motion / Kinect / RealSense / Tobii / 热像仪 / EEG：
   它们都只需要在本地把 SDK 读数转发成 {x,y,r,scene,style}。 */
function bridgeStart(){
  const B=S.bridge;
  if(B.es){ try{ B.es.close(); }catch(e){} }
  B.ok=false; B.t=0;
  try{
    B.es=new EventSource('/events?room=ext');
    B.es.onopen=()=>{ B.ok=true; flashHint(t('fxBridgeOk')); };
    B.es.onerror=()=>{ B.ok=false; };
    B.es.onmessage=e=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(typeof m.x==='number') B.x=clampN(m.x,0,1);
      if(typeof m.y==='number') B.y=clampN(m.y,0,1);
      if(typeof m.z==='number') B.z=clampN(m.z,0,1);
      if(typeof m.r==='number') B.r=clampN(m.r,0.02,3);
      if(m.scene!==undefined) changeScene(((m.scene|0)%SCENE_COUNT+SCENE_COUNT)%SCENE_COUNT);
      if(m.style!==undefined) setStyle(STYLE_ORDER[(m.style|0)%STYLE_ORDER.length]);
      if(m.cmd==='splat') pushSplat(B.x*DW,B.y*DH,70,110);
      if(m.name) B.name=String(m.name).slice(0,18);
      B.t=performance.now();
    };
  }catch(e){ flashHint(t('fxBridgeWait')); }
}
/* ── 闭环回传：页面 → 本地脚本（灯光跟随 / 触觉 / 闭环校准都用这条） ──
   之前只有"脚本 → 页面"（SSE 下行）+ 手机→页面（POST），缺"页面 → 脚本"。
   现在页面每 500ms 把当前状态 POST 到 room=ext-state，任何脚本订阅 /events 即可收到。 */
let _stateT=0;
function pushState(force){
  const now=performance.now();
  if(!force && now-_stateT<500) return;
  _stateT=now;
  const B=S.bridge||{};
  const body={type:'state', mode:S.mode, scene:S.scene, style:S.style,
    x:+(B.x||0).toFixed(4), y:+(B.y||0).toFixed(4), r:+(B.r||1).toFixed(3),
    z:+(B.z||0.5).toFixed(3), presence:+(B.presence==null?1:B.presence).toFixed(2),
    bpm:(S.beat2&&S.beat2.bpm)||0, screens:(S.screens&&S.screens.n)||1,
    t:Date.now()};
  try{ fetch('/send?room=ext-state',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),keepalive:false}).catch(()=>{}); }catch(e){}
}
function bridgeStop(){ const B=S.bridge; try{ B.es&&B.es.close(); }catch(e){} B.es=null; B.ok=false; }

/* ── 外部创作软件驱动 API ──
   一条 ingest 路径，三种到达方式：
     · HTTP/OSC（Blender / TouchDesigner / Max / Resolume / Unreal …）
     · postMessage（p5.js / Hydra / 任何同源或跨源 iframe 父页面）
     · window.InkScroll.*（同源页面直接调用，最省事）
   载荷统一为 {x,y,r,scene,style,cmd,name}，x/y 归一化 0..1。 */
function extIngest(m){
  if(!m||typeof m!=='object') return;
  const B=S.bridge;
  if(typeof m.x==='number') B.x=clampN(m.x,0,1);
  if(typeof m.y==='number') B.y=clampN(m.y,0,1);
  if(typeof m.z==='number') B.z=clampN(m.z,0,1);        // 0 = 贴近画纸, 1 = 深处
  if(m.presence!=null) B.presence=clampN(+m.presence,0,1);
  if(m.state&&typeof m.state==='object') B.state=m.state;
  if(m.id!=null) B.id=String(m.id).slice(0,64);
  if(typeof m.r==='number') B.r=clampN(m.r,0.02,3);
  if(m.scene!==undefined) changeScene(((m.scene|0)%SCENE_COUNT+SCENE_COUNT)%SCENE_COUNT);
  if(m.style!==undefined) setStyle(STYLE_ORDER[(m.style|0)%STYLE_ORDER.length]);
  if(m.cmd==='splat') pushSplat(B.x*DW,B.y*DH,70,110);
  if(m.cmd==='paint') togglePaint();
  if(m.name) B.name=String(m.name).slice(0,18);
  B.t=performance.now();
  B.ok=true;
  if(S.running && S.mode!=='bridge' && S.mode!=='osc') wM('bridge');   // 外部接管
}
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||typeof d!=='object') return;
  if(d.type==='ink'||d.ink===true) extIngest(d);
});
window.InkScroll={
  version:1,
  spot:(x,y,r)=>extIngest({x,y,r}),
  scene:(i)=>extIngest({scene:i}),
  style:(i)=>extIngest({style:i}),
  splat:()=>extIngest({cmd:'splat'}),
  paint:()=>extIngest({cmd:'paint'}),
  ingest:extIngest,
  get state(){ return {mode:S.mode, scene:S.scene, style:S.style, x:S.bridge.x, y:S.bridge.y, r:S.bridge.r}; },
};

/* ── NFC 贴纸（Chrome Android）：贴一下换画 ── */
async function nfcStart(){
  if(!('NDEFReader' in window)){ flashHint(t('fxNfcWait')); return; }
  try{
    const r=new NDEFReader();
    await r.scan();
    r.onreading=ev=>{
      let txt='';
      try{ for(const rec of ev.message.records){ if(rec.recordType==='text'||rec.recordType==='url') txt+=new TextDecoder(rec.encoding||'utf-8').decode(rec.data); } }catch(e){}
      S.nfc={last:txt};
      const w=SPEECH_WORDS.find(w=>w.re.test(txt));
      if(w) w.act(); else changeScene((S.scene+1)%SCENE_COUNT);
      pushSplat(S.mouseX,S.mouseY,66,120);
      flashHint(t('fxNfcTag')+' · '+(txt.slice(0,10)||'—'));
    };
    flashHint(t('fxNfcWait'));
  }catch(e){ flashHint(t('fxNfcWait')); }
}
function nfcStop(){}

/* ── 眨眼（FaceMesh EAR）：眨眼一次泼一次墨 ── */
function earOf(lm,idx){
  const p=i=>lm[i];
  const d=(a,b)=>Math.hypot(p(a).x-p(b).x, p(a).y-p(b).y);
  return (d(idx[1],idx[5])+d(idx[2],idx[4]))/(2*(d(idx[0],idx[3])||1e-3));
}
function eyesTick(){
  const F=S.face, E=S.eyes;
  if(!F.seen){ return null; }
  if(E.ear==null) return null;
  const now=performance.now();
  if(E.ear<0.19 && !E.closed){ E.closed=true; }
  else if(E.ear>0.26 && E.closed){
    E.closed=false;
    if(now-E.last>420){ E.last=now; pushSplat(F.nx*DW,F.ny*DH,54,100); flashHint('👁'); }
  }
  return null;
}
function eyesStart(){ faceStart(); }

/* ── 环境光（AmbientLightSensor）：越暗光圈越大 ── */
function lightStart(){
  const L=S.light;
  if(!('AmbientLightSensor' in window)){ flashHint(t('fxLightFail')); return; }
  try{
    const s=new AmbientLightSensor({frequency:2});
    s.addEventListener('reading',()=>{ L.lux=s.illuminance; L.ok=true; });
    s.addEventListener('error',()=>{ L.ok=false; });
    s.start();
    L.sensor=s; L.ok=true;
  }catch(e){ flashHint(t('fxLightFail')); L.ok=false; }
}
function lightStop(){ const L=S.light; try{ L.sensor&&L.sensor.stop(); }catch(e){} L.sensor=null; L.ok=false; }

/* ── 吹墨：对着麦克风吹气，墨层像灰尘一样被吹散，露出下面的彩色 ──
   用一个 alpha 蒙版积累"被吹过"的区域，停下来会慢慢回墨。 */
function ensureDust(){
  if(!S.dust.cvs || S.dust.cvs.width!==DW || S.dust.cvs.height!==DH){
    const c=document.createElement('canvas'); c.width=DW; c.height=DH;
    S.dust.cvs=c; S.dust.ctx=c.getContext('2d');
    const b=document.createElement('canvas'); b.width=b.height=256;
    const bx=b.getContext('2d');
    const g=bx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,'rgba(255,255,255,.95)');
    g.addColorStop(.55,'rgba(255,255,255,.55)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    bx.fillStyle=g; bx.fillRect(0,0,256,256);
    S.dust.brush=b;
  }
}
function dustTick(sp,lv){
  ensureDust();
  const D=S.dust, g=D.ctx, r=(sp.radius||S.radius)*(0.9+lv*0.8);
  if(lv>0.14){                                   // 正在吹
    g.globalAlpha=Math.min(0.42, 0.12+lv*0.5);
    g.drawImage(D.brush, sp.x-r, sp.y-r, r*2, r*2);
    g.globalAlpha=1;
    D.level=Math.min(1,(D.level||0)+0.05);
  }else{
    g.globalCompositeOperation='destination-out'; // 回墨（慢慢落回去）
    g.globalAlpha=0.012; g.fillRect(0,0,DW,DH);
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
    D.level=Math.max(0,(D.level||0)-0.02);
  }
  D.t=performance.now();
}

/* ── 滚轮 · 只有触控板/鼠标时也能玩：滚轮累积量当坐标，速度当半径 ── */
function scrollInit(){ S.scroll={acc:0,t:performance.now(),v:0}; }
function scrollSpot(){
  const S2=S.scroll;
  const speed=Math.min(1, Math.abs(S2.v)/32);
  S2.v*=0.86;                                   // 速度衰减
  return {x:DW*(0.5+Math.sin(S2.acc*0.0021)*0.42), y:DH*(0.5+Math.cos(S2.acc*0.0013)*0.34),
          radius:S.radius*(0.5+speed*1.5)};
}

/* ── 电池 · 电量就是光圈大小（笔记本 / 手机都行，Chromium） ── */

/* ── 形式：供奉（放下一处供奉，它自己长大，像香火） ── */
function offeringAdd(x,y,now){
  S.offerings.push({x,y,t:now,r:8});
  if(S.offerings.length>12) S.offerings.shift();       // 最多 12 处，避免糊满
  return S.offerings[S.offerings.length-1];
}
function offeringGrow(list,now,maxMs){
  const out=[];
  for(const o of list){
    const age=now-o.t;
    if(age> (maxMs||90000)) continue;                  // 90 秒后熄灭
    const k=Math.min(1, age/9000);                     // 9 秒长到最大
    out.push({...o, r: 8 + k*(Math.min(DW,DH)*0.22), a: 1-k*0.55});
  }
  return out;
}

/* ── 形式：驱赶（光把墨推开，推过的地方面积永久扩大） ── */
function repelTick(sp, dust){
  const r=(sp.radius||S.radius)*0.9;
  dust.globalAlpha=0.30;
  dust.drawImage(S.dust.brush, sp.x-r, sp.y-r, r*2, r*2);
  dust.globalAlpha=1;
  S.dust.level = Math.min(1,(S.dust.level||0)+0.03);   // 自己维护等级，调用方不必写回
  return S.dust.level;
}
/* ── 形式：召唤（墨点被吸向光，松手炸开） ── */
function summonStep(dots, sx, sy, k){
  for(const d of dots){
    d.x += (sx-d.x)*(k||0.18);
    d.y += (sy-d.y)*(k||0.18);
  }
  return dots;
}
function summonAdd(dots, sx, sy, n){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2, r=180+Math.random()*220;
    dots.push({x:sx+Math.cos(a)*r, y:sy+Math.sin(a)*r});
  }
  return dots;
}
/* ── 形式：书写（笔速越快，笔画越细） ── */
function writeWidth(speed){ return clampN(1-(speed||0)/1400, 0.18, 1); }
/* ── 形式：仪式（三个不同位置、5 秒内点完，才开 10 秒） ── */
function ritualTap(taps, x, y, now){
  taps.push({x,y,t:now});
  const recent=taps.filter(t=>now-t.t<=5000);
  taps.length=0; taps.push(...recent);
  if(taps.length>=3){
    let ok=true;
    for(let i=0;i<taps.length;i++) for(let j=i+1;j<taps.length;j++)
      if(Math.hypot(taps[i].x-taps[j].x, taps[i].y-taps[j].y)<60) ok=false;
    if(ok) return true;
  }
  return false;
}

/* ── 形式：延迟（把光晚 N 秒出现，和过去的自己错位） ── */
function delayPush(buf, spots, now, ms){
  buf.push({t:now, s:spots});
  const cut = now - ms - 2000;                  // 只剪远早于窗口的，别剪掉要取的那帧
  while(buf.length>2 && buf[0].t < cut) buf.shift();
  for(let i=buf.length-1;i>=0;i--){             // 最新的、已经"够旧"的那一帧
    if(buf[i].t <= now-ms) return buf[i].s;
  }
  return null;
}
/* ── 形式：静默（安静够久 → 自己翻页） ── */
function silenceFlip(quietMs, needMs){ return quietMs >= (needMs||20000); }
/* ── 形式：日课（日期做种子：题款 / 印章 / 墨色） ── */
function dailySeed(d){
  const t=d||new Date();
  const y=t.getFullYear(), m=String(t.getMonth()+1).padStart(2,'0'), day=String(t.getDate()).padStart(2,'0');
  const key=Number(`${y}${m}${day}`);
  return { key, label:`${y}.${m}.${day}`, hue:(key*2654435761)%360 };
}

/* ── 展厅预设：?preset=kiosk|gallery|stereo|lab 一键配好 ── */
const PRESETS={
  gallery:{ mode:'auto',  scene:0, style:'paper', wall:false, grid:false, stereo:null },
  kiosk:  { mode:'auto',  scene:6, style:'edges', wall:true,  grid:true,  stereo:null },
  stereo: { mode:'mouse', scene:6, style:'edges', wall:true,  grid:false, stereo:'sbs' },
  lab:    { mode:'mouse', scene:0, style:'edges', wall:false, grid:false, stereo:null },
};
function applyPreset(name){
  const p=PRESETS[name]; if(!p) return false;
  if(p.mode&&M[p.mode]&&modeAvailable(p.mode)) S.mode=p.mode;
  if(typeof p.scene==='number') S.scene=p.scene;
  if(p.style) S.style=p.style;
  if(p.wall){ document.body.classList.add('wall'); S.wall=true; }
  else { document.body.classList.remove('wall'); S.wall=false; }
  S.grid=!!p.grid;
  S.stereo=p.stereo||null;
  DEEP_PLAY=true;
  return true;
}

/* ── 口哨 · 音高 → 音名（纯函数可单测） ── */
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteOf(freq){
  if(!freq||freq<40||freq>4000) return null;
  const midi=Math.round(69+12*Math.log2(freq/440));
  const f2=440*Math.pow(2,(midi-69)/12);
  return { name:NOTE_NAMES[((midi%12)+12)%12]+(Math.floor(midi/12)-1),
           midi, cents:Math.round(1200*Math.log2(freq/f2)) };
}

/* ── 在场 · 人是否在（IdleDetector）→ 光圈大小（纯函数可单测） ── */
function presenceRadius(idleSec, state){
  const idle=state==='idle';
  if(!idle) return 1;
  return Math.max(0.25, 0.55 - Math.min(0.3, (idleSec||0)/600));   // 越久越暗，但留 0.25
}
async function presenceStart(){
  try{
    if(!('IdleDetector' in window)){ flashHint(t('fxPresenceNo')); return; }
    const d=new IdleDetector();
    if(d.requestPermission) await d.requestPermission();
    d.addEventListener('change',()=>{ S.presence={state:d.userState,idle:Math.round(d.userState==='idle'?(performance.now()-(S.presence.t||performance.now()))/1000:0),ok:true,sensor:d,t:S.presence.t}; });
    S.presence.t=performance.now();
    await d.start({threshold:60000});
    S.presence.ok=true; S.presence.sensor=d;
    flashHint(t('fxPresenceOk'));
  }catch(e){ flashHint(t('fxPresenceNo')); }
}

/* ── 多屏 · getScreenDetails → 光落在第几块屏（纯函数可单测） ── */
function screenSpot(screens, idx){
  if(!screens||!screens.length) return {x:DW/2,y:DH/2,screen:0};
  const s2=screens[Math.min(idx||0,screens.length-1)];
  return {x:DW*(0.5+((s2.left||0)/Math.max(1,window.screen.width))*0.5),
          y:DH/2, screen:idx||0, count:screens.length};
}
async function screensStart(){
  try{
    if(!window.getScreenDetails){ flashHint(t('fxScreensNo')); return; }
    const d=await window.getScreenDetails();
    S.screens={n:d.screens.length,bounds:[...d.screens].map(x=>({left:x.left,width:x.width})),ok:true,detail:d};
    flashHint(t('fxScreensOk')+' · '+d.screens.length);
  }catch(e){ flashHint(t('fxScreensNo')); }
}

/* ── 展厅 · Keyboard.lock 吞掉 Esc 等系统键（纯函数可单测） ── */
function kioskLock(){
  try{
    if(!navigator.keyboard||!navigator.keyboard.lock) return false;
    navigator.keyboard.lock(['Escape','KeyQ','Tab','F11']);
    return true;
  }catch(e){ return false; }
}

/* ── 负载 · PressureObserver 的 CPU 压力 → 光圈（纯函数可单测） ── */
function pressureRadius(state){
  return ({nominal:1, fair:0.9, serious:0.7, critical:0.5})[state] || 1;
}
async function loadStart(){
  try{
    if(!('PressureObserver' in window)){ flashHint(t('fxLoadNo')); return; }
    const ob=new PressureObserver(recs=>{
      const r=recs&&recs[0]; if(!r) return;
      S.load={state:r.state,ok:true,obs:S.load.obs};
    });
    await ob.observe('cpu',{sampleInterval:2000});
    S.load.obs=ob; S.load.ok=true; flashHint(t('fxLoadOk'));
  }catch(e){ flashHint(t('fxLoadNo')); }
}

/* ── 时间 · 小时 → 光的位置与色调（纯函数，可单测） ── */
function hoursSpot(h, m){
  const day=((h||0)+(m||0)/60);
  const ang=((day-6)/24)*Math.PI*2;                 // 6 点从左边升起
  const elev=Math.sin(((day-6)/12)*Math.PI);        // 正午最高
  return {x:DW*(0.5+0.42*Math.cos(ang)), y:DH*(0.62-0.34*Math.max(0,elev)),
          radius:S.radius*(0.45+0.75*Math.max(0.12,elev)), state:{hour:day, elevation:+elev.toFixed(3)}};
}
/* ── 取色 · 最近场景（纯函数，可单测） ── */
const SCENE_TINT=[[118,120,110],[86,110,84],[196,204,214],[206,158,150],[26,28,54]];
function hexToRgb(h){
  const v=String(h||'').replace('#','');
  if(v.length!==6) return null;
  const n=parseInt(v,16); if(isNaN(n)) return null;
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function nearestScene(hex){
  const c=hexToRgb(hex); if(!c) return -1;
  let best=0, bd=1e9;
  SCENE_TINT.forEach((t,i)=>{ const d=(t[0]-c[0])**2+(t[1]-c[1])**2+(t[2]-c[2])**2; if(d<bd){bd=d;best=i;} });
  return best;
}
/* ── 剪贴板 · 读一段文字当指令（复用语音的关键词表） ── */
async function clipRead(){
  try{
    if(!navigator.clipboard||!navigator.clipboard.readText){ S.clip={text:'',ok:false,t:performance.now()}; flashHint(t('fxClipFail')); return; }
    const txt=(await navigator.clipboard.readText())||'';
    S.clip={text:txt.slice(0,80),ok:true,t:performance.now()};
    const w=SPEECH_WORDS.find(w=>w.re.test(txt));
    if(w) w.act(); else pushSplat(S.mouseX,S.mouseY,56,100);
    flashHint(t('fxClipOk')+' · '+(txt.slice(0,10)||'—'),1600);
  }catch(e){ S.clip={text:'',ok:false,t:performance.now()}; flashHint(t('fxClipFail')); }
}
async function inkpickOpen(){
  if(!window.EyeDropper){ flashHint(t('fxPickFail')); return; }
  try{
    const r=await new EyeDropper().open();
    S.pick={hex:r.sRGBHex,rgb:hexToRgb(r.sRGBHex),t:performance.now()};
    const sc=nearestScene(r.sRGBHex); if(sc>=0) changeScene(sc);
    flashHint(t('fxPickOk')+' · '+r.sRGBHex,1800);
  }catch(e){ flashHint(t('fxPickFail')); }
}

/* ── 噪声 · 慢速 RMS：房间的底噪当作"气息"，比拍手更细腻 ── */
function noiseTick(){
  const A=S.audio, N=S.noise;
  const lv=A.on?(A.level||0):0;
  N.v=N.v*0.985+lv*0.015;                      // ~1.5s 时间常数
  return N.v;
}

/* ── 节拍 · 频谱通量：从音乐里估 BPM，每拍泼一次墨 ── */
function beatTick(){
  const A=S.audio, B=S.beat2;
  if(!A.on||!A.freq){ return B; }
  const f=A.freq;
  if(!B.prev){ B.prev=Uint8Array.from(f); return B; }
  let flux=0;
  for(let i=2;i<f.length;i++){ const d=f[i]-B.prev[i]; if(d>0) flux+=d; }
  B.prev=Uint8Array.from(f);
  B.flux=B.flux*0.7+flux*0.3;
  const now=performance.now();
  if(flux>260 && now-B.last>260){
    if(B.last){ B.ints.push(now-B.last); if(B.ints.length>12) B.ints.shift(); }
    B.last=now;
    if(B.ints.length>=4){
      const m=[...B.ints].sort((a,b)=>a-b)[Math.floor(B.ints.length/2)];
      if(m>250) B.bpm=Math.round(60000/m);
    }
    pushSplat(S.mouseX,S.mouseY,52+Math.min(50,flux/8),110);
  }
  return B;
}

/* ── 拍手节拍（onset）：拍一下泼墨，连拍两下换画 ── */
function clapOnset(){
  const C=S.clap, now=performance.now();
  if(now-C.last<260) return;
  C.last=now;
  if(now-C.prev<760){ changeScene((S.scene+1)%SCENE_COUNT); C.prev=0; flashHint('👏'); }
  else { C.prev=now; pushSplat(S.mouseX,S.mouseY,58,100); }
}

/* ───────────────────────────────────────────────────────────
   契约归一化 — 所有模态的输出都必须过这一关。

   Spot = { x, y, radius, id, presence, state, hue?, brush?, ang?, frozen? }
     · id        谁（多灯/多人时区分身份；单灯也有默认值）
     · presence  在场强度 0..1（低 → 光圈更小更淡，用于"有人靠近/离开"）
     · state     该模态自己的连续状态袋（呼吸值、抓握、深度…），渲染层不懂也无妨
   这样加第 34 个模态时，不需要再往 x/y 里硬塞信息。
   ─────────────────────────────────────────────────────────── */
function normSpot(s,i){
  if(!s) return null;
  const pr = s.presence==null ? 1 : clampN(+s.presence,0,1);
  return {
    x: clampN(+s.x||0, 0, DW),
    y: clampN(+s.y||0, 0, DH),
    radius: clampRadius((s.radius==null?S.radius:+s.radius))*(0.55+0.45*pr),
    id: s.id!=null ? String(s.id) : ('sp'+(i||0)),
    presence: pr,
    state: (s.state&&typeof s.state==='object') ? s.state : {},
    hue: s.hue, brush: s.brush|0, ang: +s.ang||0, frozen: !!s.frozen,
  };
}

/* ───────────────────────────────────────────────────────────
   Modes — a registry, not a switch statement. Every entry
   satisfies the same contract:
     {icon, nameKey, group, needCam, needMic, init, spot, cln, ex, meter}
   `spot()` returns {x,y,radius} (or null to fall through to the
   attract loop) and `group` decides where the card lives.
   Adding a modality = adding one entry here + one I18N key.
   ─────────────────────────────────────────────────────────── */
const M={
  /* 不可失败：不依赖任何输入 */
  auto:{
    icon:'auto',nameKey:'modeAuto',group:'free',needCam:false,fallback:'none',
    init(){S.autoT=0;},
    spot(){ S.autoT=(S.autoT||0)+0.0045;
      return {x:DW*(0.82-0.64*((S.autoT*0.22)%1)), y:DH*(0.5+0.16*Math.sin(S.autoT*0.9)), radius:S.radius*0.8}; },
    cln(){}, ex:()=>'',
  },
  /* 不可失败：指针永远存在，是所有模态的兜底 */
  mouse:{
    icon:'pointer',nameKey:'modeMouse',group:'free',needCam:false,fallback:'none',
    init(){},
    spot(){ const r=(S.pen&&S.pressure>0)?S.radius*(0.45+1.1*S.pressure):S.radius;
      return {x:S.mouseX,y:S.mouseY,radius:r}; },
    cln(){}, ex:()=>'',
  },
  audio:{
    icon:'audio',nameKey:'modeAudio',group:'free',needMic:true,fallback:'hint',
    init(){ audioStart(); },
    spot(){ return audioSpot(); },
    cln(){ audioStop(); },
    ex(){ return S.audio.on?'':'🎙 '+t('micWaiting'); },
    meter(){ return {label:t('meterLevel'), value:S.audio.level}; },
  },
  tilt:{
    icon:'tilt',nameKey:'modeTilt',group:'free',
    init(){ tiltStart(); },
    spot(){ const T=S.tilt;
      if(!T.ready||performance.now()-T.last>1600) return null;
      const nx=clampN((T.gamma-T.base.gamma)/26*0.5+0.5,0,1);
      const ny=clampN((T.beta-T.base.beta)/26*0.5+0.5,0,1);
      T.sx=T.sx==null?nx:T.sx*.82+nx*.18;
      T.sy=T.sy==null?ny:T.sy*.82+ny*.18;
      return {x:T.sx*DW, y:T.sy*DH, radius:S.radius}; },
    cln(){ tiltStop(); },
    ex(){ return S.tilt.ready?'':'📐 '+t('tiltCenter'); },
  },
  motion:{
    icon:'motion',nameKey:'modeMotion',group:'cam',needCam:true,
    init(){ motionReset(); },
    spot(){ motionTick(); const m=S.motion;
      if(!m.seen) return null;
      return {x:m.x, y:m.y, radius:S.radius*(0.5+m.level*1.35)}; },
    cln(){ motionReset(); },
    ex(){ const m=S.motion; return m.seen?'':'🌗 '+t('motionWaiting'); },
    meter(){ return {label:t('meterLevel'), value:S.motion.level}; },
  },
  hand:{
    icon:'hand',nameKey:'modeHand',group:'cam',needCam:true,
    init(){iH();},
    spot(id){if(S.hpos&&S.gesture!=='fist')return{x:S.hpos.x,y:S.hpos.y,radius:S.gesture==='point'?25:S.radius};return null;},
    cln(){hr=false;S.hlm=null;S.hpos=null;S.gesture='none';},  // hands stays warm: closing mid-frame breaks the wasm loader
    ex:()=>{
      if(S.gesture==='victory') return '✌ '+t('gestureVictory');
      const map={open:'gestureOpen',fist:'gestureFist',point:'gesturePoint'};
      return map[S.gesture] ? '🖐 '+t(map[S.gesture]) : '';
    },
  },
  face:{
    icon:'face',nameKey:'modeFace',group:'cam',needCam:true,
    init(){ faceStart(); },
    spot(){ const F=S.face;
      if(!F.ready||!F.seen) return null;
      return {x:clampN(F.nx,0,1)*DW, y:clampN(F.ny,0,1)*DH, radius:S.radius*(0.55+(F.open||0)*1.7)}; },
    cln(){ faceStop(); },
    ex(){ const F=S.face; return F.seen?'':'🙂 '+t('faceNoFace'); },
    meter(){ return {label:t('meterLevel'), value:S.face.open||0}; },
  },
  flashlight:{
    icon:'flashlight',nameKey:'modeFlashlight',group:'cam',needCam:true,needsPixels:true,fallback:'hint',
    init(){},spot(id){return spF(id);},cln(){},
    ex:()=>'',
  },
  gaze:{
    icon:'gaze',nameKey:'modeGaze',group:'gear',needCam:true,needsPixels:true,
    init(){ enterGaze(); },
    spot(fd){
      if(!S.gazeReady || !gazeFit || !arDetector) return null;
      const f = getArFrame() || fd;
      if(!f) return null;
      let markers;
      try{ markers = arDetector.detect(f); }catch(e){ return null; }
      if(!markers.length){ return S.gazeSmooth ? {x:S.gazeSmooth.x, y:S.gazeSmooth.y, radius:S.radius} : null; }
      const c = markerCenter(markers[0], f.width, f.height);
      const px = gazeFit.x[0] + gazeFit.x[1]*c.nx + gazeFit.x[2]*c.ny;
      const py = gazeFit.y[0] + gazeFit.y[1]*c.nx + gazeFit.y[2]*c.ny;
      const a = 0.45;
      if(!S.gazeSmooth) S.gazeSmooth={x:px,y:py};
      else{ S.gazeSmooth.x=a*px+(1-a)*S.gazeSmooth.x; S.gazeSmooth.y=a*py+(1-a)*S.gazeSmooth.y; }
      return {x:S.gazeSmooth.x, y:S.gazeSmooth.y, radius:S.radius};

/* ───────────────────────────────────────────────────────────
   Phone controller — phone sensors streamed over the SSE relay
   (needs server.py, which provides /events + /send). Each phone
   opens /phone.html#room=<token>, reads its own DeviceOrientation
   and POSTs it; the display subscribes via EventSource and turns
   each phone into a spotlight. Multiple phones -> multiple lights.
   ─────────────────────────────────────────────────────────── */
function clampN(v,a,b){return v<a?a:(v>b?b:v);}
// 色身 — deterministic per-phone identity colour (from session id) + small colour helpers
const JEWEL=['#c96442','#6b8e6e','#7b8fa8','#b8583a','#d97757','#5e7d8e'];
function hueFromId(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return JEWEL[h%JEWEL.length];}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function phoneActiveCount(){const now=performance.now();return Object.values(S.phone.targets).filter(tg=>(tg.frozen||now-tg.t<=S.phone.staleMs)&&String(tg.id||'').indexOf('#')<0).length;}
function phoneNewToken(){
  const a=new Uint8Array(6);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a); else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
  return Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join('').slice(0,8);
}
function phoneUrl(){ return `${location.origin}/phone.html?v=${S.phone.room}#room=${S.phone.room}`; }
function phoneStart(){
  const P=S.phone;
  P.targets={};P.primaryId=null;P.calib={};P.splats=[];P.seq=0;P.overlap={};P.ink=false;P.strokeLast={};
  P.room=phoneNewToken();
  showPhonePair(phoneUrl());
  try{
    P.es=new EventSource(`/events?room=${encodeURIComponent(P.room)}`);
    P.es.onmessage=e=>phoneIngest(e.data);
    P.es.onopen=()=>{ P.relay=true; const er=document.getElementById('pp-err');if(er)er.style.display='none'; };
    P.es.onerror=()=>{ if(!P.es||P.es.readyState===2){ P.relay=false; const er=document.getElementById('pp-err');if(er)er.style.display='block'; } };
  }catch(err){ const er=document.getElementById('pp-err');if(er)er.style.display='block'; }
}
function phoneStop(){
  const P=S.phone;
  if(P.es){try{P.es.close();}catch(e){}P.es=null;}
  P.targets={};P.primaryId=null;P.splats=[];P.overlap={};P.ink=false;P.strokeLast={};
  hidePhonePair();
  refreshRoster();
}
// 🔴 WebSerial IR tracker — an OpenMV/Pixy2 streams "x,y[,area]" (0..1) per line; realizes the IR-flashlight vision via the SAME spot contract, no render-engine change
let irReader=null;
async function irStart(){ S.ir={x:DW/2,y:DH/2,r:0,t:0,port:null};
  if(!('serial' in navigator)){ flashHint(t('irWaiting')); return; }
  try{ const port=await navigator.serial.requestPort(); await port.open({baudRate:115200}); S.ir.port=port;
    const dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(()=>{}); irReader=dec.readable.getReader(); let buf='';
    (async()=>{ try{ for(;;){ const {value,done}=await irReader.read(); if(done)break; buf+=value;
      let nl; while((nl=buf.indexOf('\n'))>=0){ const ln=buf.slice(0,nl); buf=buf.slice(nl+1);
        const p=ln.trim().split(/[,\s]+/).map(Number);
        if(p.length>=2 && isFinite(p[0]) && isFinite(p[1])){ S.ir.x=clampN(p[0],0,1)*DW; S.ir.y=clampN(p[1],0,1)*DH; if(isFinite(p[2]))S.ir.r=clampN(p[2],0.02,0.5)*Math.min(DW,DH); S.ir.t=performance.now(); } } } }catch(e){} })();
  }catch(e){ flashHint(t('irWaiting')); }
}
function irStop(){ try{ irReader&&irReader.cancel(); }catch(e){} irReader=null; try{ S.ir&&S.ir.port&&S.ir.port.close(); }catch(e){} S.ir=null; }
function phoneIngest(raw){
  let msg; try{msg=JSON.parse(raw);}catch(e){return;}
  if(msg.type==='haptic') return;                 // ignore our own echoed reverse-channel message
  const P=S.phone, id=msg.id; if(!id)return;
  if(msg.type==='paint'){ S.paint=!S.paint; flashHint(t(S.paint?'fxPaintOn':'fxPaintOff')); syncBar(); return; }   // phone long-press 💦 toggles 留痕
  const now=performance.now();
  // prune phones gone silent (missed 'bye') — but never a deliberately FROZEN one
  for(const k in P.targets){ if(!P.targets[k].frozen && now-P.targets[k].t>4000){ delete P.targets[k]; if(P.primaryId===k)P.primaryId=null; } }
  if(msg.type==='bye'){ delete P.targets[id]; if(P.primaryId===id)P.primaryId=null; if(!P.primaryId)P.primaryId=Object.keys(P.targets)[0]||null; refreshPhoneCount(); refreshRoster(); return; }
  if(!P.primaryId) P.primaryId=Object.keys(P.targets)[0]||null;
  if(msg.type==='calib'){ P.calib[id]={beta:+msg.beta||0,gamma:+msg.gamma||0}; const t0=P.targets[id]; if(t0){ t0.twist=0; t0.twistBase=0; } return; }   // 居中: zero BOTH ends' twist reference
  // content-only / position-less messages: handle BEFORE creating a wand target (no phantom roster seal/count)
  if(msg.type==='music'){ if(msg.onset){ const t2=P.targets[id]; pushSplat(t2?t2.smX:DW/2, t2?t2.smY:DH/2, 22+(+msg.level||0)*44, 90); } return; }   // 墨随声动
  if(msg.type==='text'){ inkText(id, msg.text||''); return; }   // 题字成境
  if(msg.type==='geo'){ S.geo.push({x:clampN(+msg.x||0,0,1),y:clampN(+msg.y||0,0,1),hue:hueFromId(id)}); if(S.geo.length>200)S.geo.shift(); flashHint(t('fxGeo')); return; }
  if(msg.type==='rps'){ rpsMove(id, msg.move); return; }   // 石头剪刀布
  if(msg.type==='beat'){ beatTap(id); return; }   // 击节点墨
  let tg=P.targets[id];
  if(!tg){ tg=P.targets[id]={smX:DW/2,smY:DH/2,smR:S.radius,t:now,id:id,hue:hueFromId(id),frozen:false,brush:0,twist:0,twistBase:0,ang:0,trailT:0,seq:(++P.seq)}; if(!P.primaryId)P.primaryId=id; refreshPhoneCount(); refreshRoster(); hidePhonePair(); }
